// ── MEMBER DASHBOARD ──────────────────────────────────────────
async function renderViewDashboard() {
  const app = document.getElementById('app-content');
  app.innerHTML = _skeletonPage();

  const res = await callAPI('getMemberData', { token: AppState.sessionToken });
  if (!res.success) {
    Toast.error(res.error);
    Router.go('home');
    return;
  }

  const d = res.data;
  AppState.set('notifications', d.notifications || []);
  AppState.set('unreadCount', (d.notifications || []).filter(n => !n.read).length);
  _updateNotifBadge();

  // โหลด master data เพื่อ lookup ชื่อสาขา/หลักสูตร
  const [brRes, crRes] = await Promise.all([
    callAPI('getMasterData', { token: AppState.sessionToken, type: 'branch' }),
    callAPI('getMasterData', { token: AppState.sessionToken, type: 'course' }),
  ]);
  const branchMap = {};
  const courseMap = {};
  (brRes.success ? brRes.data.items : []).forEach(b => { branchMap[b.id] = b.name; });
  (crRes.success ? crRes.data.items : []).forEach(c => { courseMap[c.id] = c.name; });
  AppState.set('masterBranches', brRes.success ? brRes.data.items : []);
  AppState.set('masterCourses',  crRes.success ? crRes.data.items : []);

  const testCount  = (d.testQueues  || []).length;
  const trainCount = (d.trainQueues || []).length;
  const activeTest  = (d.testQueues  || []).filter(q => !['cancelled','passed','failed'].includes(q.status)).length;
  const activeTrain = (d.trainQueues || []).filter(q => !['cancelled','completed'].includes(q.status)).length;

    <div style="background:linear-gradient(135deg,#0f3b75 0%,#1d4ed8 60%,#6366f1 100%);color:white;padding:20px 20px 48px;position:relative;overflow:hidden">

      <div style="position:absolute;bottom:-20px;left:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.04)"></div>

      <!-- top row -->
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;position:relative">
        <div>
          <div style="font-size:13px;opacity:0.75;margin-bottom:2px">สวัสดีคุณ 👋</div>
          <div style="font-size:21px;font-weight:700;line-height:1.2;margin-bottom:2px">${d.fullName}</div>
          <div style="font-size:13px;opacity:0.65">${d.phone}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            ${AppState.unreadCount > 0 ? `<span style="position:absolute;top:-3px;right:-3px;background:#ef4444;color:white;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid transparent">${AppState.unreadCount}</span>` : ''}

            แก้ไขข้อมูล
          </button>
        </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative">
        <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,0.15)">

        </div>
        <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,0.15)">
          <div style="font-size:22px;font-weight:700;line-height:1;color:#86efac">${activeTest + activeTrain}</div>

        </div>
        <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,0.15)">
          <div style="font-size:22px;font-weight:700;line-height:1;color:#fde68a">${AppState.unreadCount || 0}</div>
          <div style="font-size:12px;opacity:0.75;margin-top:2px">แจ้งเตือนใหม่</div>
        </div>
      </div>
    </div>

    <!-- ═══ QUICK ACTIONS (floating over header) ═══ -->
    <div style="margin:-24px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:10">
      <button onclick="Router.go('catalog',{tab:'test'})" style="background:white;border:none;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.1);transition:all 0.2s;text-align:left" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 20px rgba(0,0,0,0.12)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 16px rgba(0,0,0,0.1)'">
        <div style="width:36px;height:36px;border-radius:10px;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
        </div>
        <div>
          <div style="font-size:14px;font-weight:700;color:#0f172a">สมัครทดสอบ</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Skills Test</div>
        </div>
      </button>
      <button onclick="Router.go('catalog',{tab:'training'})" style="background:white;border:none;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.1);transition:all 0.2s;text-align:left" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 20px rgba(0,0,0,0.12)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 16px rgba(0,0,0,0.1)'">
        <div style="width:36px;height:36px;border-radius:10px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <div>
          <div style="font-size:14px;font-weight:700;color:#0f172a">สมัครอบรม</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Training</div>
        </div>
      </button>
    </div>

    <!-- ═══ CONTENT ═══ -->
    <div style="padding:0 16px 120px;max-width:480px;margin:0 auto">

      <!-- Audio Alert Banner -->
      <div id="audio-alert-banner" style="display:none;background:linear-gradient(135deg,#0d9488,#0f766e);border-radius:14px;padding:12px 14px;margin-bottom:14px;align-items:center;gap:10px">
        <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:700;color:white">รอเรียกคิวอยู่ใช่ไหม?</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.8)">เปิดเสียงแจ้งเตือนเพื่อไม่พลาดคิว</div>
        </div>
        <button onclick="AudioModule.unlock();this.textContent='✓';this.disabled=true;this.style.opacity='0.6'" style="padding:7px 12px;border-radius:8px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;font-size:13px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;flex-shrink:0">เปิดเสียง</button>
      </div>
      \x3Cscript>
        setTimeout(() => { if(typeof AudioModule !== 'undefined' && AudioModule.isLocked) { const b = document.getElementById('audio-alert-banner'); if(b) b.style.display='flex'; } }, 1000);
      \x3C/script>

      <!-- Notification Banners -->
      ${_renderNotifBanners(d.notifications || [])}

      <!-- ── TEST QUEUES ── -->
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:4px;height:18px;background:#3b82f6;border-radius:2px"></div>
            <span style="font-size:16px;font-weight:700;color:#0f172a">ทดสอบมาตรฐานฝีมือ</span>
          </div>
          ${activeTest > 0 ? `<span style="background:#eff6ff;color:#3b82f6;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px">${activeTest} กำลังดำเนินการ</span>` : ''}
        </div>
        ${d.testQueues && d.testQueues.length > 0
          ? d.testQueues.map(q => _renderTestQueueCard(q, branchMap)).join('')
          : `<div style="background:white;border:2px dashed #e2e8f0;border-radius:14px;padding:28px 16px;text-align:center">
               <div style="font-size:32px;margin-bottom:8px">📋</div>
               <div style="font-size:15px;color:#94a3b8;font-weight:500">ยังไม่มีการสมัครทดสอบ</div>
               <button onclick="Router.go('catalog',{tab:'test'})" style="margin-top:12px;padding:8px 18px;background:#3b82f6;color:white;border:none;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif">สมัครทดสอบ →</button>
             </div>`}
      </div>

      <!-- ── TRAINING QUEUES ── -->
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:4px;height:18px;background:#22c55e;border-radius:2px"></div>
            <span style="font-size:16px;font-weight:700;color:#0f172a">ฝึกอบรมอาชีพ</span>
          </div>
          ${activeTrain > 0 ? `<span style="background:#f0fdf4;color:#16a34a;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px">${activeTrain} กำลังดำเนินการ</span>` : ''}
        </div>
        ${d.trainQueues && d.trainQueues.length > 0
          ? d.trainQueues.map(q => _renderTrainQueueCard(q, courseMap)).join('')
          : `<div style="background:white;border:2px dashed #e2e8f0;border-radius:14px;padding:28px 16px;text-align:center">
               <div style="font-size:32px;margin-bottom:8px">📚</div>
               <div style="font-size:15px;color:#94a3b8;font-weight:500">ยังไม่มีการสมัครอบรม</div>
               <button onclick="Router.go('catalog',{tab:'training'})" style="margin-top:12px;padding:8px 18px;background:#22c55e;color:white;border:none;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif">สมัครอบรม →</button>
             </div>`}
      </div>

    </div>`;
}

function _renderNotifBanners(notifications) {
  if (!notifications || notifications.length === 0) return '';
  return notifications.filter(n => !n.read).map(n => `
    <div class="notif-banner" id="notif-${n.id}">
      <span class="notif-banner-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue-600)" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>

function _testTimeline(status, apptDate) {
  const steps = [
    { key: 'pending',   label: 'รอตรวจสอบ' },
    { key: 'confirmed', label: 'ยืนยันแล้ว' },
    { key: 'testing',   label: 'กำลังทดสอบ' },
    { key: 'passed',    label: 'ผ่านการทดสอบ' },
  ];
  const failKeys = ['failed','cancelled'];
  if (failKeys.includes(status)) {
    return `<div class="timeline-item"><span class="timeline-dot danger"></span><div class="text-sm">${_statusLabel(status)}</div></div>`;
  }

  const order = steps.map(s => s.key);
  const curIdx = order.indexOf(status);

  return steps.map((s, i) => {
    let cls = '';
    if (i < curIdx)       cls = 'done';
    else if (i === curIdx) cls = 'active';
    const detail = s.key === 'confirmed' && apptDate
      ? `<div class="text-xs text-muted">นัดหมาย: ${_formatDate(apptDate)}</div>` : '';
    return `<div class="timeline-item">
      <span class="timeline-dot ${cls}"></span>
      <div class="text-sm ${i <= curIdx ? '' : 'text-muted'}">${s.label}${detail}</div>
    </div>`;
  }).join('');
}

function _trainTimeline(status, apptDate) {
  const steps = [
    { key: 'pending',   label: 'รอตรวจสอบ' },
    { key: 'approved',  label: 'อนุมัติแล้ว' },
    { key: 'training',  label: 'กำลังอบรม' },
    { key: 'completed', label: 'จบอบรมแล้ว' },
  ];
  const failKeys = ['cancelled'];
  if (failKeys.includes(status)) {
    return `<div class="timeline-item"><span class="timeline-dot danger"></span><div class="text-sm">${_statusLabel(status)}</div></div>`;
  }

  let mappedStatus = status;
  if (status === 'confirmed') mappedStatus = 'approved';

  const order = steps.map(s => s.key);
  const curIdx = order.indexOf(mappedStatus);

  return steps.map((s, i) => {
    let cls = '';
    if (i < curIdx)       cls = 'done';
    else if (i === curIdx) cls = 'active';
    const detail = s.key === 'approved' && apptDate
      ? `<div class="text-xs text-muted">เริ่ม: ${_formatDate(apptDate)}</div>` : '';
    return `<div class="timeline-item">
      <span class="timeline-dot ${cls}"></span>
      <div class="text-sm ${i <= curIdx ? '' : 'text-muted'}">${s.label}${detail}</div>
    </div>`;
  }).join('');
}

async function cancelQueueConfirm(queueId, type, calendarEventId) {
  Modal.confirm(
    'ยืนยันการยกเลิกคิว',
    'คุณต้องการยกเลิกคิวนี้ใช่หรือไม่? ไม่สามารถย้อนคืนได้',
    async () => {
      const res = await callAPI('cancelQueue', {
        token: AppState.sessionToken,
        queueId, type,
      });
      if (!res.success) { Toast.error(res.error); return; }

      // ลบ calendar event
      if (res.data.calendarEventId || calendarEventId) {
        await CalendarMgr.deleteEvent(res.data.calendarEventId || calendarEventId);
      }

      Toast.success('ยกเลิกคิวแล้ว');
      Router.go('dashboard');
    },
    'ยกเลิกคิว', true
  );
}

// ── PRINT PDF ─────────────────────────────────────────────────
async function printPDF(queueId, type) {
  const btn = document.querySelector(`[onclick*="printPDF('${queueId}"]`);
  if (btn) _setLoading(btn, true, '');

  const res = await callAPI('generatePDF', {
    token: AppState.sessionToken,
    role:  'member',
    queueId, type,
  });

  if (btn) _setLoading(btn, false);

  if (!res.success) { Toast.error(res.error); return; }

  Toast.success('สร้าง PDF แล้ว');
  window.open(res.data.pdfUrl, '_blank');
  // refresh
  setTimeout(() => Router.go('dashboard'), 500);
}

function rbUpdateCourseName(sel) {
  const custom = document.getElementById('rb-custom-name-row');
  if (sel.value === '__custom__') {
    custom.style.display = 'block';
    document.getElementById('rb-custom-name').focus();
  } else {
    custom.style.display = 'none';
  }
  rbUpdatePreview();
}

function rbUpdatePreview() {
  const selEl    = document.getElementById('rb-course-select');
  const customEl = document.getElementById('rb-custom-name');
  const batchEl  = document.getElementById('rb-batch');
  const preEl    = document.getElementById('rb-preview');
  if (!preEl) return;

  let name = '';
  if (selEl && selEl.value && selEl.value !== '__custom__') {
    name = (selEl.options[selEl.selectedIndex] ? selEl.options[selEl.selectedIndex].dataset.name : null) || '';
  } else if (customEl) {
    name = customEl.value.trim();
  }
  const batch = (batchEl ? (batchEl.value || '').trim() : '') || '';
  const clean = name.replace(/[/\\?%*:|"<>]/g, '-');
  preEl.textContent = clean && batch ? `${clean}-รุ่นที่${batch}.json` : '–';
}

function startBatchRegister() {
  const selEl    = document.getElementById('rb-course-select');
  const customEl = document.getElementById('rb-custom-name');
  const batchEl  = document.getElementById('rb-batch');

  let courseName = '', courseId = '', type = '';
  if (selEl && selEl.value && selEl.value !== '__custom__') {
    const opt  = selEl.options[selEl.selectedIndex];
    courseName = (opt ? opt.dataset.name : null) || '';
    courseId   = selEl.value;
    type       = (opt ? opt.dataset.type : null) || '';
  } else if (customEl) {
    courseName = customEl.value.trim();
  }
  const batch = (batchEl ? (batchEl.value || '').trim() : '') || '';

  if (!courseName) { Toast.error('กรุณาเลือกหรือกรอกชื่อหลักสูตร'); return; }
  if (!batch)      { Toast.error('กรุณากรอกรุ่นที่'); return; }

  // reset RegState
  RegState.courseName = courseName;
  RegState.batch      = batch;
  RegState.courseId   = courseId;
  RegState.type       = type;
  RegState.persons    = [];
  RegState.activeIdx  = -1;

  Modal.close();
  Router.go('admin-register', { courseName, batch, courseId, type });
}

    setTimeout(() => {
      const mountNode = document.getElementById('dsd-profile-mount');

        DsdPersonForm.mount(mountNode, profile, {});
        
        // ล็อคช่องเบอร์โทรไว้ เพื่อป้องกันการเปลี่ยนเบอร์เข้าสู่ระบบโดยตรง

          telInput.disabled = true;
          telInput.style.background = 'var(--gray-50)';
          telInput.style.cursor = 'not-allowed';
        }

        // แสดงรูปโปรไฟล์ใน Header ด้านบนแบบ real-time
        const updateHeaderAvatar = () => {
          const imgData = (DsdPersonForm._data ? DsdPersonForm._data.profileImage : null);
          const displayImg = document.getElementById('profile-avatar-display-img');
          const displayIcon = document.getElementById('profile-avatar-display-icon');
          if (imgData && imgData.startsWith('data:')) {
            if (displayImg) { displayImg.src = imgData; displayImg.style.display = 'block'; }
            if (displayIcon) { displayIcon.style.display = 'none'; }
          } else {
            if (displayImg) { displayImg.style.display = 'none'; }
            if (displayIcon) { displayIcon.style.display = 'block'; }
          }
        };

        updateHeaderAvatar();

        // ดักฟังการอัปเดตรูปถ่ายโปรไฟล์จาก input
        const origUpdateProgress = DsdPersonForm.updateProgress;
        DsdPersonForm.updateProgress = function() {
          origUpdateProgress.call(this);
          updateHeaderAvatar();
        };

      } else {
        Toast.error('ไม่พบไฟล์แบบฟอร์ม DSD');
      }
    }, 100);

  } catch (err) {
    console.error('Error rendering profile:', err);

      </div>
    `;
  }
}


async function renderViewNotifications() {
  const app = document.getElementById('app-content');
  app.innerHTML = _skeletonPage();

  const res = await callAPI('getMemberData', { token: AppState.sessionToken });
  if (!res.success) {
    Toast.error(res.error);
    Router.go('home');
    return;
  }

  const d = res.data;

  // โหลดหรือสร้าง lookup map สำหรับดึงชื่อหลักสูตรและสาขาทดสอบ
  const branchMap = {};
  const courseMap = {};
  (AppState.masterBranches || []).forEach(b => { branchMap[b.id] = b.name; });
  (AppState.masterCourses || []).forEach(c => { courseMap[c.id] = c.name; });

  const notifications = d.notifications || [];

  app.innerHTML = `
    <div class="page-header" style="margin-top: 60px">
      <button class="back-btn" onclick="Router.go('dashboard')">${_icon('arrow-left')}</button>
      <h1 style="flex:1">การแจ้งเตือน</h1>
    </div>
    <div class="page-content" style="padding-top:16px">
      ${notifications.length === 0 ? `
        <div class="empty-state" style="padding:48px 16px; text-align:center">
          <div style="width:56px;height:56px;background:var(--gray-50);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
          </div>
          <p style="color:var(--gray-500)">ไม่มีการแจ้งเตือนนัดหมายในขณะนี้</p>
        </div>
      ` : notifications.map(n => {
        const isTest = n.type === 'test';
        let targetName = '';
        if (isTest) {
          const item = d.testQueues.find(q => q.queueId === n.queueId);
          const branchId = item ? item.branchId : '';
          targetName = branchMap[branchId] || branchId || 'การทดสอบมาตรฐานฝีมือแรงงาน';
        } else {
          const item = d.trainQueues.find(q => q.enrollId === n.queueId);
          const courseId = item ? item.courseId : '';
          targetName = courseMap[courseId] || courseId || 'หลักสูตรฝึกอบรมฯ';
        }

        // เช็คว่ามีคำว่า "กำหนดการนัดหมายใหม่" ไหม เพื่อจะโชว์ปุ่มรับนัด
        const isAppt = n.message && n.message.includes('กำหนดการนัดหมายใหม่');
        // ดึงวันที่นัดหมายออกจากข้อความ ถ้าเป็นไปได้
        let apptDateStr = n.date;
        if (isAppt) {
          const match = n.message.match(/ในวันที่\s+([0-9/:\s]+)/);
          if (match) apptDateStr = match[1];
        }

        return `
          <div class="card" style="margin-bottom:12px; border-left: 4px solid ${isTest ? 'var(--blue-600)' : 'var(--purple-600)'}; position: relative;">
            <div class="card-body" style="padding:16px">
              <button onclick="deleteNotificationClient('${n.id}')" style="position:absolute; top:12px; right:12px; background:none; border:none; cursor:pointer; color:var(--gray-400); padding:4px;" title="ลบการแจ้งเตือน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
              </button>
              <div style="display:flex; gap:12px; align-items:flex-start">
                <span style="font-size: 28px; line-height:1">${isTest ? '📝' : '🎓'}</span>
                <div style="flex:1; padding-right: 24px;">
                  <div style="font-weight:700; font-size: 16px; color:var(--gray-800)">
                    ${n.message ? n.message : (isTest ? 'มีการนัดหมายทดสอบมาตรฐานฝีมือแรงงาน' : 'มีการนัดหมายฝึกอบรมฯ')}
                  </div>
                  <div style="font-size: 15px; color:var(--gray-600); margin-top:2px">
                    ${targetName}
                  </div>
                  <div style="font-size: 14px; color:var(--blue-600); font-weight:600; margin-top:6px; display:flex; align-items:center; gap:4px">
                    <span>📅</span> วันที่แจ้ง: ${_formatDate(n.date)}
                  </div>
                  
                  ${isAppt ? `
                  <div style="margin-top:12px; border-top:1px solid var(--gray-100); padding-top:12px; display:flex; justify-content:flex-end">
                    <button class="btn btn-primary btn-sm" id="btn-ack-${n.id}"
                      onclick="acknowledgeAppointment('${n.queueId}', '${n.type}', '${apptDateStr}', '${targetName.replace(/'/g,"\\'")}')">
                      รับนัด + บันทึกปฏิทิน
                    </button>
                  </div>` : ''}
                </div>
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

async function deleteNotificationClient(notifId) {
  Modal.confirm(
    'ลบการแจ้งเตือน',
    'คุณต้องการลบการแจ้งเตือนนี้ใช่หรือไม่?',
    async () => {
      const res = await callAPI('deleteNotification', {
        token: AppState.sessionToken,
        notifId
      });
      if (!res.success) {
        Toast.error(res.error);
        return;
      }
      Toast.success('ลบการแจ้งเตือนสำเร็จ');
      renderViewNotifications();
    }
  );
}

async function submitProfileUpdate() {
  if (typeof DsdPersonForm === 'undefined') {
    Toast.error('ระบบฟอร์มขัดข้อง');
    return;
  }

  // Validate form
  if (!DsdPersonForm.validate()) {
    Toast.error('กรุณากรอกข้อมูลบังคับ (*) ให้ครบถ้วน');
    return;
  }

  // Collect form data
  const profileData = DsdPersonForm.collect();
  if (!profileData) return;

  const btn = document.getElementById('btn-pf-save');
  _setLoading(btn, true, 'กำลังบันทึกข้อมูล...');

  // Convert to JSON String
  const profileJsonStr = JSON.stringify(profileData);

  const res = await callAPI('updateMemberProfile', {
    token: AppState.sessionToken,
    profileJson: profileJsonStr,
  });

  _setLoading(btn, false);

  if (!res.success) {
    Toast.error(res.error || 'บันทึกไม่สำเร็จ');
    return;
  }

  // Update name and state
  const newName = (profileData.reg_firstname + ' ' + (profileData.reg_lastname || '')).trim();
  AppState.set('currentUser', { 
    ...(AppState.currentUser || {}), 
    fullName: newName,
  });
  AppState.saveSession();

  Toast.success('ปรับปรุงข้อมูลส่วนตัวสำเร็จ!');
  
  // Reload profile view in read mode
  renderViewProfile();
}
</script>
