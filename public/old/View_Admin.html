<script>
// ============================================================
//  View_Admin.html — Premium Admin Dashboard v3.0 (Sidebar Edition)
// ============================================================

let _dbChartInstance = null;




async function renderViewAdminDashboard(params = {}) {
  const app = document.getElementById('app-content');
  const bottomNav = document.getElementById('bottom-nav');
  if (bottomNav) bottomNav.style.display = 'none';

  const userName = AppState.currentUser?.fullName || 'ผู้ดูแลระบบ';
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const contentHTML = `
    <style>
      /* ── HERO ── */

      }
      .adm-hero-badge {
        display:inline-flex; align-items:center; gap:6px;

      .adm-stat-icon {

      }

      .adm-stat-change { margin-top: 8px; font-size: 10.5px; font-weight: 600; display:flex; align-items:center; gap:3px; }

      .adm-stat-change.down { color: #ef4444; }
      .adm-stat-change.warn { color: #f59e0b; }
      .adm-stat-link {

      .adm-course-card-hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
      .adm-course-num {

      .adm-progress-bar { height:5px; background:#f1f5f9; border-radius:999px; overflow:hidden; margin-bottom:10px; }
      .adm-progress-fill { height:100%; border-radius:999px; transition:width .5s; }
      .adm-progress-fill.green  { background:linear-gradient(90deg,#10b981,#34d399); }
      .adm-progress-fill.amber  { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
      .adm-progress-fill.red    { background:linear-gradient(90deg,#ef4444,#f87171); }
      .adm-course-actions { display:flex; gap:6px; }

      .adm-course-btn.del    { background:#fff1f2; color:#e11d48; }

      .adm-add-card {
        background:white; border-radius:14px; padding:16px;
        border:2px dashed #e0e7ff;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;

      .adm-add-card:hover { border-color:#6366f1; background:#faf5ff; }
      .adm-add-icon {
        width:40px; height:40px; border-radius:50%;

      }
      .adm-add-label { font-size:13px; font-weight:600; color:#6366f1; }
      .adm-add-sub   { font-size:10.5px; color:#a5b4fc; margin-top:2px; }

      /* ── BOTTOM GRID ── */
      .adm-bottom-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; padding-bottom:30px; }
      .adm-card { background: white; border-radius: 14px; border: 1px solid #e2e8f0; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.02); margin-bottom:16px;}
      
      /* Activity List */

      .adm-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink:0; }
      .adm-av.blue   { background: linear-gradient(135deg,#3b82f6,#2563eb); }
      .adm-av.green  { background: linear-gradient(135deg,#10b981,#059669); }
      .adm-av.amber  { background: linear-gradient(135deg,#f59e0b,#d97706); }

      .adm-act-main { font-size: 13px; color: #1e293b; }
      .adm-act-sub  { font-size: 11px; color: #64748b; margin-top: 2px; margin-bottom: 4px; }
      .adm-status-chip { display:inline-block; font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; }
      .adm-status-chip.pending { background:#fef3c7; color:#92400e; }
      .adm-status-chip.confirmed { background:#dbeafe; color:#1e40af; }
      .adm-status-chip.cancelled { background:#fee2e2; color:#991b1b; }

      /* Quick Panel */
      .adm-panel-title { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 14px; display:flex; align-items:center; gap:6px; }
      .adm-quick-list { display: flex; flex-direction: column; gap: 8px; }
      .adm-quick-btn {
        display: flex; align-items: center; gap: 12px; padding: 10px 12px;
        background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
        cursor: pointer; transition: all .15s; text-align: left; width: 100%;
      }
      .adm-quick-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
      .adm-q-icon { width: 30px; height: 30px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
      .adm-q-text { font-size: 13px; font-weight: 600; color: #1e293b; }
      .adm-q-sub  { font-size: 10px; color: #64748b; margin-top: 1px; }
      .adm-q-arrow { margin-left: auto; color: #cbd5e1; font-weight: 700; font-size:16px;}

      /* Notice */
      .adm-notice-list { display:flex; flex-direction:column; gap:10px; }
      .adm-notice { display:flex; align-items:flex-start; gap:10px; padding:10px; background:#f8fafc; border-radius:10px; border-left:3px solid #cbd5e1;}
      .adm-notice-dot { width:8px; height:8px; border-radius:50%; margin-top:4px; flex-shrink:0; background:#cbd5e1;}
      .adm-notice-dot.red { background:#ef4444; box-shadow:0 0 0 3px #fee2e2; }
      .adm-notice-dot.amber { background:#f59e0b; box-shadow:0 0 0 3px #fef3c7; }
      .adm-notice-dot.blue { background:#3b82f6; box-shadow:0 0 0 3px #dbeafe; }
      .adm-notice-text { font-size:12px; font-weight:500; color:#1e293b; }
      .adm-notice-time { font-size:10px; color:#94a3b8; margin-top:2px; }
      
      /* Body Content Padding */
      .adm-body { padding: 20px; flex: 1; }
      
      /* Mobile responsive */
      @media (max-width: 768px) {
        .adm-stat-grid { grid-template-columns: repeat(2,1fr); }
        .adm-course-grid { grid-template-columns: 1fr; }
        .adm-bottom-grid { grid-template-columns: 1fr; }
        .adm-hero { flex-direction: column; gap:16px; align-items: flex-start; }
      }
    </style>

    ${AdminLayout.buildTopbar('แดชบอร์ด', 'ภาพรวมระบบและสถิติ')}

    <!-- BODY -->
    <div class="adm-body">

      <!-- HERO BANNER -->
      <div class="adm-hero">
        <div>
          <div class="adm-hero-badge"><span class="ping"></span> พร้อมใช้งาน</div>
          <h2>สวัสดี, ${userName} 👋</h2>
          <div class="adm-hero-sub" id="adm-hero-sub">กำลังโหลดข้อมูลสรุป...</div>
          <div class="adm-hero-date">${dateStr}</div>
        </div>
        <div class="adm-hero-btns">
          <button class="adm-hero-btn primary" onclick="Router.go('admin-queue',{type:'test',status:'pending'})">📋 คิวรอดำเนินการ</button>
          <button class="adm-hero-btn" onclick="Router.go('admin-master',{type:'course'})">📚 จัดการหลักสูตร</button>
          <button class="adm-hero-btn" onclick="Router.go('admin-report')">📊 ดูรายงาน</button>
        </div>
      </div>

      <!-- STAT CARDS -->
      <div class="adm-stat-grid" id="adm-stat-grid">
        ${_admStatSkeleton()}
      </div>

      <!-- COURSE SECTION -->
      <div class="adm-section-hdr">
        <h3>📚 หลักสูตรอบรมที่เปิดรับสมัคร</h3>
        <a onclick="Router.go('admin-master',{type:'course'})">จัดการทั้งหมด →</a>
      </div>
      <div class="adm-course-grid" id="adm-course-grid">
        ${_admCourseSkeleton()}
      </div>

      <!-- BOTTOM GRID -->
      <div class="adm-bottom-grid">

        <!-- ACTIVITY FEED -->
        <div class="adm-card">
          <div class="adm-section-hdr" style="margin-bottom:4px">
            <h3>🕐 กิจกรรมล่าสุด</h3>
            <a onclick="Router.go('admin-queue',{type:'test'})">ดูทั้งหมด →</a>
          </div>
          <div class="adm-activity-list" id="adm-activity-list">
            <div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px">กำลังโหลด...</div>
          </div>
        </div>

        <!-- QUICK PANEL -->
        <div class="adm-quick-panel">
          <div class="adm-card">
            <div class="adm-panel-title">⚡ การดำเนินการด่วน</div>
            <div class="adm-quick-list">
              <button class="adm-quick-btn" onclick="Router.go('admin-queue',{type:'test',status:'pending'})">
                <div class="adm-q-icon" style="background:#ede9fe">📋</div>
                <div><div class="adm-q-text">จัดการคิวทดสอบ</div><div class="adm-q-sub" id="q-test-pending">กำลังโหลด...</div></div>
                <div class="adm-q-arrow">›</div>
              </button>
              <button class="adm-quick-btn" onclick="Router.go('admin-queue',{type:'training',status:'pending'})">
                <div class="adm-q-icon" style="background:#d1fae5">📚</div>
                <div><div class="adm-q-text">จัดการคิวอบรม</div><div class="adm-q-sub" id="q-train-pending">กำลังโหลด...</div></div>
                <div class="adm-q-arrow">›</div>
              </button>
              <button class="adm-quick-btn" onclick="Router.go('admin-master',{type:'course'})">
                <div class="adm-q-icon" style="background:#fef3c7">🎓</div>
                <div><div class="adm-q-text">จัดการหลักสูตร</div><div class="adm-q-sub">เพิ่ม/ลบ/จัดการโควตา</div></div>
                <div class="adm-q-arrow">›</div>
              </button>
              <button class="adm-quick-btn" onclick="exportDbData('xlsx')">
                <div class="adm-q-icon" style="background:#dbeafe">📤</div>
                <div><div class="adm-q-text">ส่งออก Excel</div><div class="adm-q-sub">ดาวน์โหลดข้อมูลทั้งหมด</div></div>
                <div class="adm-q-arrow">›</div>
              </button>
            </div>
          </div>

          <div class="adm-card">
            <div class="adm-panel-title">🔔 แจ้งเตือนระบบ</div>
            <div class="adm-notice-list" id="adm-notice-list">
              <div style="text-align:center;padding:16px;color:#94a3b8;font-size:12px">กำลังโหลด...</div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /body -->
  `;

  app.innerHTML = AdminLayout.build(contentHTML, 'admin-dashboard');

  // Start clock
  AdminLayout.startClock();

  // Load data
  await _admLoadDashboard();
}

function _admStatSkeleton() {
  return Array(4).fill(`
    <div class="adm-stat">
      <div style="width:40px;height:40px;border-radius:11px;background:#f1f5f9;margin-bottom:12px"></div>
      <div style="width:60%;height:28px;background:#f1f5f9;border-radius:6px;margin-bottom:6px"></div>
      <div style="width:80%;height:12px;background:#f1f5f9;border-radius:6px"></div>
    </div>`).join('');
}

function _admCourseSkeleton() {
  return Array(3).fill(`
    <div class="adm-course-card" style="min-height:150px">
      <div style="width:100%;height:14px;background:#f1f5f9;border-radius:6px;margin-bottom:8px"></div>
      <div style="width:70%;height:12px;background:#f1f5f9;border-radius:6px;margin-bottom:16px"></div>
      <div style="width:100%;height:5px;background:#f1f5f9;border-radius:999px"></div>
    </div>`).join('');
}

let _admClockTimer = null;
function _admStartClock() {
  if (_admClockTimer) clearInterval(_admClockTimer);
  _admClockTimer = setInterval(() => {
    const el = document.getElementById('adm-clock');
    if (!el) { clearInterval(_admClockTimer); return; }
    el.textContent = '⏰ ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }, 1000);
}

async function _admLoadDashboard() {
  const res = await callAPI('getDashboardData', {
    token: AppState.sessionToken,
    startDate: '', endDate: '', serviceType: 'all'
  });

  if (!res.success) {
    document.getElementById('adm-stat-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#ef4444;padding:20px">${res.error}</div>`;
    return;
  }

  const d = res.data;

  // Update hero sub
  const heroSub = document.getElementById('adm-hero-sub');
  if (heroSub) heroSub.innerHTML = `วันนี้มีคิวสะสม <strong>${d.totalQuotas}</strong> รายการ · รอดำเนินการ <strong>${d.pendingCount}</strong> รายการ`;

  // Update sidebar badges
  const testBadge  = document.getElementById('sidebar-test-badge');
  const trainBadge = document.getElementById('sidebar-train-badge');
  if (testBadge)  testBadge.textContent  = d.pendingCount || 0;
  if (trainBadge) trainBadge.textContent = d.pendingTrainingCount || 0;

  // Quick action subs
  const qTest  = document.getElementById('q-test-pending');
  const qTrain = document.getElementById('q-train-pending');
  if (qTest)  qTest.textContent  = `มีคิวรอ ${d.pendingCount || 0} รายการ`;
  if (qTrain) qTrain.textContent = `มีคิวรอ ${d.pendingTrainingCount || 0} รายการ`;

  // Stat cards
  const statGrid = document.getElementById('adm-stat-grid');
  if (statGrid) statGrid.innerHTML = `
    <div class="adm-stat" onclick="Router.go('admin-queue',{type:'test'})">
      <div class="adm-stat-link">↗</div>
      <div class="adm-stat-icon" style="background:#dbeafe">📋</div>
      <div class="adm-stat-val">${d.totalQuotas || 0}</div>
      <div class="adm-stat-label">คิวสะสมทั้งหมด</div>
      <div class="adm-stat-change up">▲ คิวสมัครในระบบ</div>
    </div>
    <div class="adm-stat" onclick="Router.go('admin-queue',{type:'test',status:'pending'})">
      <div class="adm-stat-link">↗</div>
      <div class="adm-stat-icon" style="background:#fef3c7">⏳</div>
      <div class="adm-stat-val">${d.pendingCount || 0}</div>
      <div class="adm-stat-label">รอดำเนินการ (ทดสอบ)</div>
      <div class="adm-stat-change warn">▲ ต้องจัดการ</div>
    </div>
    <div class="adm-stat" onclick="Router.go('admin-queue',{type:'test',status:'passed'})">
      <div class="adm-stat-link">↗</div>
      <div class="adm-stat-icon" style="background:#d1fae5">✅</div>
      <div class="adm-stat-val">${d.completedCount || 0}</div>
      <div class="adm-stat-label">ผ่านเกณฑ์/จบอบรม</div>
      <div class="adm-stat-change up">▲ ดำเนินการสำเร็จ</div>
    </div>
    <div class="adm-stat" onclick="Router.go('admin-queue',{type:'test',status:'cancelled'})">
      <div class="adm-stat-link">↗</div>
      <div class="adm-stat-icon" style="background:#fee2e2">❌</div>
      <div class="adm-stat-val">${(d.cancelledCount || 0) + (d.failedCount || 0)}</div>
      <div class="adm-stat-label">ยกเลิก/ไม่ผ่าน</div>
      <div class="adm-stat-change down">ยกเลิก ${d.cancelledCount||0} · ไม่ผ่าน ${d.failedCount||0}</div>
    </div>
  `;

  // Activity feed
  _admRenderActivity(d.recentActivity || []);

  // Notices
  _admRenderNotices(d);

  // Load courses separately
  await _admLoadCourses();
}

function _admRenderActivity(activities) {
  const el = document.getElementById('adm-activity-list');
  if (!el) return;

  if (!activities || activities.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px">ยังไม่มีกิจกรรม</div>`;
    return;
  }

  const colors = ['blue','green','amber','red','purple'];
  el.innerHTML = activities.slice(0,6).map((a, i) => `
    <div class="adm-activity-item">
      <div class="adm-av ${colors[i % colors.length]}">${(a.fullName || '?').charAt(0)}</div>
      <div style="flex:1">
        <div class="adm-act-main">${a.fullName || '-'} สมัคร <strong>${a.refName || '-'}</strong></div>
        <div class="adm-act-sub">📋 ${a.queueId || '-'} · ${_formatDate(a.appliedAt)}</div>
        <span class="adm-status-chip ${a.status === 'pending' ? 'pending' : a.status === 'cancelled' ? 'cancelled' : 'confirmed'}">${_statusLabel(a.status)}</span>
      </div>
    </div>`).join('');
}

function _admRenderNotices(d) {
  const el = document.getElementById('adm-notice-list');
  if (!el) return;
  const notices = [];
  if (d.pendingCount > 0) notices.push({ dot: 'amber', text: `มีคิวทดสอบรอดำเนินการ ${d.pendingCount} รายการ`, time: 'ล่าสุด' });
  if (d.pendingTrainingCount > 0) notices.push({ dot: 'blue', text: `มีคิวอบรมรอดำเนินการ ${d.pendingTrainingCount} รายการ`, time: 'ล่าสุด' });
  if (d.cancelledCount > 0) notices.push({ dot: 'red', text: `มีการยกเลิกคิว ${d.cancelledCount} รายการ`, time: 'วันนี้' });

  if (notices.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:16px;color:#94a3b8;font-size:12px">✅ ไม่มีการแจ้งเตือน</div>`;
    return;
  }
  el.innerHTML = notices.map(n => `
    <div class="adm-notice">
      <div class="adm-notice-dot ${n.dot}"></div>
      <div>
        <div class="adm-notice-text">${n.text}</div>
        <div class="adm-notice-time">${n.time}</div>
      </div>
    </div>`).join('');
}

async function _admLoadCourses() {
  const grid = document.getElementById('adm-course-grid');
  if (!grid) return;

  const res = await callAPI('getMasterData', { token: AppState.sessionToken, type: 'course' });
  if (!res.success || !res.data.items) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px">ไม่สามารถโหลดข้อมูลหลักสูตรได้</div>`;
    return;
  }

  const courses = res.data.items;
  if (courses.length === 0) {
    grid.innerHTML = `
      <div class="adm-add-card" onclick="Router.go('admin-master',{type:'course'})">
        <div class="adm-add-icon">➕</div>
        <div class="adm-add-label">เพิ่มหลักสูตรใหม่</div>
        <div class="adm-add-sub">ยังไม่มีหลักสูตรในระบบ</div>
      </div>`;
    return;
  }

  const courseCards = courses.map((c, i) => {
    const cur = c.currentQueue || 0;
    const max = c.maxQueue || 1;
    const pct = Math.round((cur / max) * 100);
    const isFull = cur >= max;
    const isWarn = pct >= 80 && !isFull;
    const fillClass = isFull ? 'red' : isWarn ? 'amber' : 'green';
    const badgeClass = isFull ? 'full' : isWarn ? 'warn' : 'open';
    const badgeText = isFull ? '🔒 เต็มแล้ว' : isWarn ? '⚡ ใกล้เต็ม' : '✅ เปิดรับ';
    const countColor = isFull ? '#dc2626' : isWarn ? '#d97706' : '#059669';
    const safeName = c.name ? c.name.replace(/'/g, "\\'") : '';

    return `
      <div class="adm-course-card">
        <div class="adm-course-card-hdr">
          <div class="adm-course-num">${i + 1}</div>
          <span class="adm-course-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="adm-course-name">${c.name}</div>
        <div class="adm-course-sub">⏱ ${c.extra || '-'} วัน · ID: ${c.id}</div>
        <div class="adm-progress-lbl">
          <span>ผู้สมัคร</span>
          <span style="font-weight:700;color:${countColor}">${cur}/${max} คน</span>
        </div>
        <div class="adm-progress-bar"><div class="adm-progress-fill ${fillClass}" style="width:${pct}%"></div></div>
        <div class="adm-course-actions">
          <button class="adm-course-btn manage" onclick="Router.go('admin-queue',{type:'training',search:'${safeName}'})">👥 จัดการคิว</button>
          <button class="adm-course-btn del" onclick="_admDeleteCourse('${c.id}','${safeName}')">🗑️ ลบ</button>
        </div>
      </div>`;
  });

  // Add "add" card at end
  courseCards.push(`
    <div class="adm-add-card" onclick="Router.go('admin-master',{type:'course'})">
      <div class="adm-add-icon">➕</div>
      <div class="adm-add-label">เพิ่มหลักสูตรใหม่</div>
      <div class="adm-add-sub">กดเพื่อเพิ่มหลักสูตรเข้าระบบ</div>
    </div>`);

  grid.innerHTML = courseCards.join('');
}

async function _admDeleteCourse(id, name) {
  Modal.confirm(
    '⚠️ ยืนยันการลบหลักสูตร',
    `ต้องการลบหลักสูตร <b>"${name}"</b> ออกจากระบบใช่หรือไม่?<br><span style="color:#ef4444;font-size:12px">*ข้อมูลจะถูกลบทันที คืนค่าไม่ได้</span>`,
    async () => {
      Toast.info('กำลังลบ...');
      const res = await callAPI('deleteMasterCourse', { token: AppState.sessionToken, courseId: id });
      if (res.success) {
        Toast.success('ลบหลักสูตรเรียบร้อย');
        await _admLoadCourses();
      } else {
        Toast.error('ลบไม่สำเร็จ: ' + res.error);
      }
    }
  );
}

async function onDashboardSearch() {
  const startDate  = document.getElementById('db-start-date')?.value  || '';
  const endDate    = document.getElementById('db-end-date')?.value    || '';
  const serviceType= document.getElementById('db-service-type')?.value|| 'all';
  const btn = document.getElementById('btn-db-search');
  if (btn) _setLoading(btn, true, 'ค้นหา...');

  if (btn) _setLoading(btn, false);
}
async function onDashboardClear() {
  const s = document.getElementById('db-start-date');
  const e = document.getElementById('db-end-date');
  const t = document.getElementById('db-service-type');
  if (s) s.value = '';
  if (e) e.value = '';
  if (t) t.value = 'all';
  await loadDashboardData();
}
