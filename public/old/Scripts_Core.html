// ── STATE MANAGER ─────────────────────────────────────────────
const AppState = {
  currentUser:        null,   // { memberId, fullName, phone, calendarAuthorized }
  userRole:           'guest',// 'guest' | 'member' | 'admin'
  sessionToken:       null,
  sessionExpiry:      null,
  currentView:        'home',
  prevView:           null,
  viewParams:         {},
  isLoading:          false,
  notifications:      [],
  unreadCount:        0,
  pendingAction:      null,   // เก็บ action ที่ค้างไว้ก่อน login
  masterBranches:     [],
  masterCourses:      [],
  _listeners:         [],

  set(key, value) {
    this[key] = value;
    this._emit(key, value);
  },

  _emit(key, value) {
    this._listeners.forEach(fn => {
      try { fn(key, value); } catch(e) {}
    });
  },

  subscribe(fn) {
    this._listeners.push(fn);
    return () => { this._listeners = this._listeners.filter(f => f !== fn); };
  },

  // บันทึก session ลง sessionStorage (กัน page reload)
  saveSession() {
    if (!this.sessionToken) return;
    try {
      sessionStorage.setItem('dsd_session', JSON.stringify({
        token:   this.sessionToken,
        expiry:  this.sessionExpiry,
        role:    this.userRole,
        user:    this.currentUser,
      }));
    } catch(e) {}
  },

  loadSession() {
    try {
      const raw = sessionStorage.getItem('dsd_session');
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s.token || Date.now() > s.expiry) {
        sessionStorage.removeItem('dsd_session');
        return false;
      }
      this.sessionToken  = s.token;
      this.sessionExpiry = s.expiry;
      this.userRole      = s.role;
      this.currentUser   = s.user;
      return true;
    } catch(e) { return false; }
  },

  clearSession() {
    this.sessionToken  = null;
    this.sessionExpiry = null;
    this.userRole      = 'guest';
    this.currentUser   = null;
    this.notifications = [];
    this.unreadCount   = 0;
    try { sessionStorage.removeItem('dsd_session'); } catch(e) {}
  },
};

// ── ROUTER ────────────────────────────────────────────────────
const Router = {
  // view ที่ต้อง login ก่อน
  _protectedMember: ['dashboard', 'profile', 'notifications'],
  _protectedAdmin:  ['admin-dashboard', 'admin-queue', 'admin-master', 'admin-report',
                     'admin-register', 'admin-members'],

  go(view, params = {}) {
    // Auth Guard
    if (this._protectedMember.includes(view) && AppState.userRole !== 'member') {
      AppState.set('pendingAction', { view, params });
      return Router.go('auth-member');
    }
    if (this._protectedAdmin.includes(view) && AppState.userRole !== 'admin') {
      AppState.set('pendingAction', { view, params });
      return Router.go('auth-admin');
    }

    AppState.set('prevView',    AppState.currentView);
    AppState.set('viewParams',  params);
    AppState.set('currentView', view);
    
    // Hide or show Navbar and Footer based on view type
    const navbar = document.querySelector('.navbar');
    const footer = document.querySelector('.footer');
    
    // Special handling for dynamic admin views that replace app.innerHTML
    if (view.startsWith('admin-')) {
      if (navbar) navbar.style.display = 'none';
      if (footer) footer.style.display = 'none';
      
      const fnName = 'renderView' + view.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('');
      if (typeof window[fnName] === 'function') {
        window[fnName](params);
        if(typeof updateNavActiveState === 'function') updateNavActiveState(view);
        window.scrollTo({ top: 0, behavior: 'instant' });
        return;
      }
    } else {
      // Restore Navbar and Footer for non-admin views
      if (navbar) navbar.style.display = 'flex';
      if (footer) footer.style.display = ''; // Let it revert to its default (grid or block)
    }
    
    _renderView(view, params);
    if(typeof updateNavActiveState === 'function') updateNavActiveState(view);
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  back() {
    const prev = AppState.prevView || 'home';
    this.go(prev);
  },
};

// ── VIEW RENDERER ─────────────────────────────────────────────
function _renderView(view, params) {
  // Hide all views
  document.querySelectorAll('.spa-view').forEach(el => {
    el.classList.remove('active');
  });
  
  // Show target view
  const target = document.getElementById(`view-${view}`);
  if (target) {
    target.classList.add('active');
  }

  // Call Specific Data Loaders based on view
  requestAnimationFrame(() => {
    try {
      if (view === 'profile' && typeof loadProfileData === 'function') {
        loadProfileData();
      } else if (view === 'admin-dashboard' && typeof loadAdminDashboard === 'function') {
        loadAdminDashboard();
      }
    } catch(e) {
      console.error('renderView error:', e);
    }
  });
}

function _updateBottomNav(view) {
  const header = document.getElementById('app-header');
  if (header) {
    if (view.startsWith('admin-')) {
      header.style.display = 'none';
    } else {
      header.style.display = 'flex';
    }
  }

  document.querySelectorAll('.btm-nav button').forEach(el => {
    el.classList.remove('active', 'text-primary');
  });
  const map = {
    'home':            'nav-home',
    'catalog':         'nav-catalog',
    'testing_list':    'nav-catalog',
    'training_list':   'nav-catalog',
    'dashboard':       'nav-home',
    'admin-dashboard': 'nav-home',
    'admin-queue':     'nav-catalog',
    'admin-master':    'nav-master',
    'admin-register':  'nav-register',
    'admin-report':    'nav-report',
    'profile':         'nav-profile',
    'notifications':   'nav-notif',
    'auth-member':     'nav-register',
    'auth-admin':      'nav-master',
  };
  const id = map[view];
  if (id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('active', 'text-primary');
  }
}

// ── API CALLER ────────────────────────────────────────────────
async function callAPI(action, payload = {}) {
  try {
    const result = await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('Request timeout')), 30000);
      google.script.run
        .withSuccessHandler(res => { clearTimeout(timeout); resolve(res); })
        .withFailureHandler(err => { clearTimeout(timeout); reject(err); })
        .callAPI(action, payload);
    });

    if (typeof result === 'string') {
      const parsed = JSON.parse(result);
      return parsed;
    }
    return result;
  } catch (e) {
    console.error('callAPI failed:', action, e);
    return { success: false, error: e.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่' };
  }
}

// ── TOAST ─────────────────────────────────────────────────────
const Toast = {
  show(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const icons = {
      success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M20 6L9 17l-5-5"/></svg>`,
      error:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
      info:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    };

    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
    container.appendChild(el);

    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, duration);
  },
  success(msg, d) { this.show(msg, 'success', d); },
  error(msg, d)   { this.show(msg, 'error',   d || 4000); },
  info(msg, d)    { this.show(msg, 'info',    d); },
};

// ── MODAL / BOTTOM SHEET ──────────────────────────────────────
function _destroyDsdPersonFormIfOpen() {
  if (document.getElementById('dsd-person-mount') && typeof DsdPersonForm !== 'undefined') {
    DsdPersonForm.destroy();
  }
}

const Modal = {
  show(contentHTML, onClose) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modal-overlay';
    overlay.innerHTML = `<div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div id="modal-content">${contentHTML}</div>
    </div>`;

    overlay.addEventListener('click', e => {
      if (e.target === overlay) this.close();
    });

    document.body.appendChild(overlay);
    this._onClose = onClose;
  },

  close() {
    _destroyDsdPersonFormIfOpen();
    const overlay = document.getElementById('modal-overlay');
    if (overlay) overlay.remove();
    var bs = document.querySelector('.bottom-sheet'); if(bs) bs.classList.remove('bottom-sheet-full');
    if (this._onClose) { this._onClose(); this._onClose = null; }
  },

  confirm(title, message, onConfirm, confirmText = 'ยืนยัน', danger = false) {
    this.show(`
      <h3 class="fw-600" style="font-size:16px;margin-bottom:8px">${title}</h3>
      <p class="text-sm text-muted" style="margin-bottom:20px">${message}</p>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="Modal.close()">ยกเลิก</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" style="flex:1" id="modal-confirm-btn">${confirmText}</button>
      </div>
    `);
    document.getElementById('modal-confirm-btn').addEventListener('click', () => {
      Modal.close();
      onConfirm();
    });
  },
};

        token: AppState.sessionToken,
        role:  AppState.userRole,
      });
      if (res.success && res.data.valid) {
        AppState.set('sessionExpiry', res.data.expiry);
        if (res.data.memberId) {
          AppState.set('currentUser', {
            ...AppState.currentUser,
            memberId:           res.data.memberId,
            fullName:           res.data.fullName,
            calendarAuthorized: res.data.calendarAuthorized,
          });
        }
        AppState.saveSession();
        this._startTimer();

        if (AppState.userRole === 'member') {
          await NotificationMgr.fetchAndShow();
          NotificationMgr.startAutoRefresh();
        }
        return true;
      } else {
        AppState.clearSession();
      }
    }
    return false;
  },

  setSession(token, expiry, role, user) {
    AppState.set('sessionToken', token);
    AppState.set('sessionExpiry', expiry);
    AppState.set('userRole', role);
    AppState.set('currentUser', user);
    AppState.saveSession();
    this._startTimer();
  },

  _startTimer() {
    clearInterval(this._timer);
    // เช็คทุก 5 นาที
    this._timer = setInterval(async () => {
      if (!AppState.sessionToken) return;
      const res = await callAPI('checkSession', {
        token: AppState.sessionToken,
        role:  AppState.userRole,
      });
      if (!res.success || !res.data.valid) {
        clearInterval(this._timer);
        AppState.clearSession();
        Toast.info('Session หมดอายุ กรุณาเข้าสู่ระบบใหม่');
        Router.go('home');
      }
    }, 5 * 60 * 1000);
  },

  async logout() {
    clearInterval(this._timer);
    if (AppState.sessionToken) {
      await callAPI('logout', {
        token: AppState.sessionToken,
        role:  AppState.userRole,
      });
    }
    AppState.clearSession();
    Toast.success('ออกจากระบบแล้ว');
    setTimeout(() => { location.reload(); }, 500);
  },
};

// ── NOTIFICATION MANAGER ──────────────────────────────────────
const NotificationMgr = {
  async fetchAndShow() {
    if (AppState.userRole !== 'member' || !AppState.sessionToken) return;
    
    // ส่ง _ts (Timestamp) ป้องกันแคช
    const res = await callAPI('getNotifications', { 
      token: AppState.sessionToken,
      _ts: new Date().getTime() 
    });
    
    if (res.success) {
      const newNotifications = res.data.notifications || [];
      const newUnreadCount = newNotifications.filter(n => !n.read).length;
      
      const oldUnreadCount = AppState.unreadCount || 0;

      // อัปเดตข้อมูลลง State
      AppState.set('notifications', newNotifications);
      AppState.set('unreadCount', newUnreadCount);
      _updateNotifBadge();

      // ถ้ามีการแจ้งเตือนใหม่เพิ่มเข้ามา
      if (newUnreadCount > oldUnreadCount) {
        const hasCallNotification = newNotifications.some(n => !n.read && n.message.includes("ถึงคิว"));
        
        if (hasCallNotification) {
          if (typeof AudioModule !== "undefined") AudioModule.play();
          
          Swal.fire({
            title: "📢 ถึงคิวของคุณแล้ว!",
            html: "<div style='font-size:18px; margin-top:10px;'>กรุณาไปที่จุดรายงานตัวด่วนครับ/ค่ะ</div>",
            icon: "info",
            iconColor: "#3b82f6",
            background: "#eff6ff",
            confirmButtonText: "รับทราบ",
            confirmButtonColor: "#2563eb",
            allowOutsideClick: false,
            allowEscapeKey: false,
            customClass: { popup: "animate__animated animate__tada" }
          }).then(() => {
            if (Router.currentRoute === "home") Router.go("notifications");
          });
        } else {
          Toast.info("🔔 มีการแจ้งเตือนใหม่ครับ");
        }
      }
    }
  },
  
  // ระบบ Short Polling ทุกๆ 5 วินาที
  startAutoRefresh() {
    if (this._timer) clearInterval(this._timer);
    
    this._timer = setInterval(() => {
      if (AppState.userRole === 'member') {
        this.fetchAndShow();
      } else {
        clearInterval(this._timer); 
      }
    }, 5000); 
  }
};

function _updateNotifBadge() {
  const badge = document.getElementById('notif-badge');
  if (!badge) return;
  const count = AppState.unreadCount;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'block' : 'none';
}

  };
  return map[status] || status;
}

function _formatDate(isoStr) {
  if (!isoStr) return '-';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return String(isoStr);
  
  if (d.getFullYear() > 2400) {
    d.setFullYear(d.getFullYear() - 543);
  }
  
  return d.toLocaleDateString('th-TH', {
    year: 'numeric', month: 'short', day: 'numeric',
    timeZone: 'Asia/Bangkok',
  });
}

function _formatDateTime(isoStr) {
  if (!isoStr) return '-';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return String(isoStr);
  
  if (d.getFullYear() > 2400) {
    d.setFullYear(d.getFullYear() - 543);
  }
  
  return d.toLocaleString('th-TH', {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit',
    timeZone: 'Asia/Bangkok',
  });
}

function _setLoading(btnEl, loading, text) {
  if (!btnEl) return;
  btnEl.disabled = loading;
  if (loading) {
    btnEl.dataset.origText = btnEl.textContent;
    btnEl.innerHTML = `<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite"></span>${text || ''}`;
  } else {
    btnEl.innerHTML = btnEl.dataset.origText || text || '';
  }
}

// ── ✅ PWA SYSTEM: Offline Detection + Cache + Install Button ──

const PWA = {
  // ── Offline Banner ─────────────────────────────────────────
  _bannerEl: null,

  showOfflineBanner() {
    if (this._bannerEl) return;
    const banner = document.createElement('div');
    banner.id = 'pwa-offline-banner';
    banner.innerHTML = [
      '<div style="background:#b45309;color:white;text-align:center;padding:8px 16px;',
      'font-size:13px;position:fixed;top:76px;left:0;right:0;z-index:9999;',
      'display:flex;align-items:center;justify-content:center;gap:8px;',
      'box-shadow:0 2px 8px rgba(0,0,0,.2);">',
      '<i class="fa-solid fa-wifi-slash"></i>',
      '<span>⚠️ ขณะนี้ไม่มีอินเทอร์เน็ต — แสดงข้อมูลที่บันทึกไว้ล่าสุด</span>',
      '</div>'
    ].join('');
    document.body.appendChild(banner);
    this._bannerEl = banner;
  },

  hideOfflineBanner() {
    if (this._bannerEl) {
      this._bannerEl.remove();
      this._bannerEl = null;
    }
  },

  // ── LocalStorage Cache ──────────────────────────────────────
  CACHE_PREFIX: 'dsd_pwa_',
  CACHE_TTL_MS: 4 * 60 * 60 * 1000, // 4 ชั่วโมง

  saveCache(key, data) {
    try {
      localStorage.setItem(this.CACHE_PREFIX + key, JSON.stringify({
        data, ts: Date.now()
      }));
    } catch(e) {}
  },

  loadCache(key, maxAge) {
    try {
      const raw = localStorage.getItem(this.CACHE_PREFIX + key);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      const ttl = maxAge || this.CACHE_TTL_MS;
      if (Date.now() - obj.ts > ttl) return null;
      return obj.data;
    } catch(e) { return null; }
  },

  clearAllCache() {
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith(this.CACHE_PREFIX)) localStorage.removeItem(k);
      });
    } catch(e) {}
  },

  // ── Expose ──────────────────────────────────────────────────
  isOnline() { return navigator.onLine; },
};

// Hook เข้า API Caller เพื่อ cache ข้อมูลสำคัญ
const _origCallAPI = window.callAPI ? window.callAPI : null;

function _initPWA() {
  // 1. Offline/Online events
  window.addEventListener('offline', () => {
    PWA.showOfflineBanner();
    console.warn('📴 PWA: Network offline');
  });

  window.addEventListener('online', () => {
    PWA.hideOfflineBanner();
    console.log('📶 PWA: Network restored');
    // Toast แจ้งเตือน
    if (window.Toast) Toast.show('เชื่อมต่ออินเทอร์เน็ตแล้ว', 'success');
  });

  // ตรวจสอบสถานะตอนเริ่ม
  if (!navigator.onLine) {
    PWA.showOfflineBanner();
  }

  // 2. ปุ่มติดตั้งแอป (โผล่เมื่อ beforeinstallprompt พร้อม)
  window.addEventListener('pwa-installable', () => {
    // แสดงปุ่มใน dropdown mobile
    const menuItem = document.getElementById('pwa-install-menu-item');
    if (menuItem) menuItem.classList.remove('hidden');
    console.log('✅ PWA install button shown');
  });

  window.addEventListener('pwa-installed', () => {
    const menuItem = document.getElementById('pwa-install-menu-item');
    if (menuItem) menuItem.classList.add('hidden');
    if (window.Toast) Toast.show('ติดตั้งแอปสำเร็จแล้ว! 🎉', 'success', 4000);
  });

  console.log('✅ PWA System initialized');
}
