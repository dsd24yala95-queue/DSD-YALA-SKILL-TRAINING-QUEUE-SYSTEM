<script>
// ============================================================
//  View_Admin_Master.html v3.0 — Sidebar Edition
// ============================================================

let _masterType = 'branch';

async function renderViewAdminMaster(params = {}) {
  const app = document.getElementById('app-content');
  const bottomNav = document.getElementById('bottom-nav');
  if (bottomNav) bottomNav.style.display = 'none';

  _masterType = params.type || 'branch';

  const contentHTML = `
    <style>
      /* Tab Switcher */
      .adm-tab-bar { display:flex; background:white; border-radius:14px; padding:4px; border:1px solid #e2e8f0; margin-bottom:20px; gap:4px; }
      .adm-tab-btn { flex:1; padding:9px 16px; border-radius:10px; border:none; background:transparent; font-size: 15px; font-weight:500; color:#94a3b8; cursor:pointer; transition:all .2s; }
      .adm-tab-btn.active { background:linear-gradient(135deg,#6366f1,#4f46e5); color:white; font-weight:600; box-shadow:0 2px 8px rgba(99,102,241,.3); }
      .adm-tab-btn:hover:not(.active) { background:#f8fafc; color:#475569; }

      /* Content Header */
      .adm-content-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
      .adm-content-hdr h3 { font-size: 17px; font-weight:700; color:#0f172a; }
      .adm-add-btn { display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#4f46e5); color:white; font-size: 15px; font-weight:600; cursor:pointer; border:none; transition:all .2s; box-shadow:0 2px 8px rgba(99,102,241,.3); }
      .adm-add-btn:hover { box-shadow:0 4px 16px rgba(99,102,241,.4); transform:translateY(-1px); }

      /* Branch Cards */
      .adm-branch-grid { display:flex; flex-direction:column; gap:12px; }
      .adm-branch-card { background:white; border-radius:14px; padding:16px 20px; border:1px solid #f1f5f9; box-shadow:0 1px 3px rgba(0,0,0,.04); display:flex; align-items:center; gap:16px; transition:all .2s; }
      .adm-branch-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
      .adm-branch-num { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#3b82f6,#6366f1); color:white; font-size: 17px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .adm-branch-info { flex:1; }
      .adm-branch-name { font-size: 16px; font-weight:700; color:#0f172a; margin-bottom:2px; }
      .adm-branch-meta { font-size: 13px; color:#64748b; }
      .adm-branch-quota { font-size: 13px; font-weight:600; }
      .adm-branch-quota.ok   { color:#059669; }
      .adm-branch-quota.warn { color:#d97706; }
      .adm-branch-quota.full { color:#dc2626; }
      .adm-toggle { display:flex; align-items:center; gap:6px; flex-shrink:0; }
      .adm-toggle-label { font-size: 13px; color:#64748b; }
      .adm-toggle-switch { width:40px; height:22px; border-radius:11px; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
      .adm-toggle-knob { position:absolute; width:16px; height:16px; background:white; border-radius:50%; top:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
      .adm-branch-actions { display:flex; gap:6px; flex-shrink:0; }
      .adm-btn-edit { padding:6px 12px; border-radius:8px; background:#ede9fe; color:#6d28d9; font-size: 13px; font-weight:600; border:none; cursor:pointer; transition:background .15s; }
      .adm-btn-edit:hover { background:#ddd6fe; }
      .adm-btn-del  { padding:6px 12px; border-radius:8px; background:#fff1f2; color:#e11d48; font-size: 13px; font-weight:600; border:none; cursor:pointer; transition:background .15s; }
      .adm-btn-del:hover { background:#ffe4e6; }

      /* Course Table */
      .adm-table-wrap { background:white; border-radius:14px; border:1px solid #e2e8f0; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04); }
      .adm-table { width:100%; border-collapse:collapse; }
      .adm-table thead tr { background:#f8fafc; border-bottom:1px solid #e2e8f0; }
      .adm-table th { padding:12px 16px; font-size: 13px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.05em; text-align:left; }
      .adm-table th.center { text-align:center; }
      .adm-table tbody tr { border-bottom:1px solid #f1f5f9; transition:background .15s; }
      .adm-table tbody tr:hover { background:#f8fafc; }
      .adm-table tbody tr:last-child { border-bottom:none; }
      .adm-table td { padding:14px 16px; }
      .adm-table td.center { text-align:center; }
      .adm-course-idx { font-size: 15px; font-weight:700; color:#94a3b8; }
      .adm-course-tname { font-size: 16px; font-weight:700; color:#0f172a; }
      .adm-course-tid { font-size: 12px; color:#94a3b8; margin-top:2px; }
      .adm-badge-type { font-size: 12px; font-weight:600; padding:3px 10px; border-radius:999px; background:#fef3c7; color:#92400e; }
      .adm-progress-mini { width:100%; height:5px; background:#f1f5f9; border-radius:999px; overflow:hidden; margin-top:5px; }
      .adm-progress-mini-fill { height:100%; border-radius:999px; }
      .adm-progress-mini-fill.green { background:linear-gradient(90deg,#10b981,#34d399); }
      .adm-progress-mini-fill.amber { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
      .adm-progress-mini-fill.red   { background:linear-gradient(90deg,#ef4444,#f87171); }

      .adm-empty { padding:40px; text-align:center; color:#94a3b8; font-size:15px; }
    </style>

    ${AdminLayout.buildTopbar('จัดการหลักสูตรและสาขา', 'เพิ่ม/แก้ไข/ลบ ข้อมูลหลักสูตรการฝึกอบรมและทดสอบ')}

    <!-- BODY -->
    <div class="adm-body">
      <!-- TAB BAR -->
      <div class="adm-tab-bar">
        <button class="adm-tab-btn ${_masterType==='branch'?'active':''}" onclick="_loadMasterList('branch')">
          🛠️ สาขาทดสอบมาตรฐาน
        </button>
        <button class="adm-tab-btn ${_masterType==='course'?'active':''}" onclick="_loadMasterList('course')">
          📚 หลักสูตรอบรมอาชีพ
        </button>
      </div>

      <!-- LIST AREA -->
      <div id="master-list">${_masterSkeleton()}</div>
    </div>
  `;

  app.innerHTML = AdminLayout.build(contentHTML, 'admin-master');
  await _loadMasterList(_masterType);
}

function _masterSkeleton() {
  return Array(3).fill(`
    <div style="background:white;border-radius:14px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px">
      <div style="width:36px;height:36px;border-radius:10px;background:#f1f5f9"></div>
      <div style="flex:1">
        <div style="width:40%;height:14px;background:#f1f5f9;border-radius:6px;margin-bottom:6px"></div>
        <div style="width:60%;height:11px;background:#f1f5f9;border-radius:6px"></div>
      </div>
    </div>`).join('');
}

async function _loadMasterList(type) {
  _masterType = type;
  const area = document.getElementById('master-list');
  if (!area) return;
  area.innerHTML = _masterSkeleton();

  const res = await callAPI('getMasterData', { token: AppState.sessionToken, type });
  if (!res.success) {
    area.innerHTML = `<div class="adm-empty"><div class="adm-empty-icon">⚠️</div><p>${res.error}</p></div>`;
    return;
  }

  const items = res.data.items || [];
  if (type === 'course') {
    _renderCourseTable(items);
  } else {
    _renderBranchList(items);
  }
}

function _renderBranchList(items) {
  const area = document.getElementById('master-list');
  if (!items || items.length === 0) {
    area.innerHTML = `<div class="adm-empty"><div class="adm-empty-icon">🏢</div><p>ยังไม่มีสาขาทดสอบ กดปุ่ม "เพิ่มรายการใหม่" ด้านบนขวา</p></div>`;
    return;
  }

  area.innerHTML = `<div class="adm-branch-grid">${items.map((item, i) => {
    const cur = item.currentQueue || 0;
    const max = item.maxQueue || 1;
    const pct = Math.round((cur / max) * 100);
    const fillClass = pct >= 100 ? 'red' : pct >= 80 ? 'amber' : 'green';
    const qClass = pct >= 100 ? 'full' : pct >= 80 ? 'warn' : 'ok';
    const qText  = pct >= 100 ? `🔒 เต็ม (${cur}/${max})` : `รับ ${cur}/${max} คน`;
    const safeName = (item.name || '').replace(/'/g, "\\'");
    const isOpen = item.isOpen;
    
    let dateStr = '';
    if (item.courseDate) {
      const dt = typeof _formatDate === 'function' ? _formatDate(item.courseDate) : item.courseDate;
      dateStr = `<div style="font-size: 13px;color:#475569;margin-top:4px;display:flex;align-items:center;gap:4px;">📅 ${dt}</div>`;
    }
    let mapStr = item.mapUrl ? `<a href="${item.mapUrl}" target="_blank" style="font-size: 12px;color:#2563eb;text-decoration:none;font-weight:600;margin-top:2px;display:inline-block;">📍 ดูแผนที่</a>` : '';

    return `
      <div class="adm-branch-card">
        <div class="adm-branch-num" style="background:linear-gradient(135deg,#3b82f6,#6366f1)">${i + 1}</div>
        <div class="adm-branch-info">
          <div class="adm-branch-name">${item.name}</div>
          <div class="adm-branch-meta">ระดับ: ${item.extra || '-'} <span style="margin-left:8px;color:#94a3b8">|</span> ID: ${item.id}</div>
          ${dateStr}
          <div style="display:flex;gap:10px;align-items:center;margin-top:2px;">
            ${item.docTemplateId
              ? '<div style="font-size: 12px;color:#059669;">✓ มี PDF Template</div>'
              : '<div style="font-size: 12px;color:#f59e0b;">⚠ ยังไม่มี PDF Template</div>'}
            ${mapStr}
          </div>
        </div>
        <div class="adm-branch-quota-col" style="min-width: 90px; text-align: center; margin-right: 12px; flex-shrink:0;">
          <div class="adm-quota-text ${qClass}" style="font-size: 13px; margin-bottom: 4px; font-weight:600;">${cur}/${max} คน</div>
          <div class="adm-progress-mini">
            <div class="adm-progress-mini-fill ${fillClass}" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="adm-toggle">
          <span class="adm-toggle-label">${isOpen ? 'เปิด' : 'ปิด'}</span>
          <div class="adm-toggle-switch" onclick="toggleMasterItem('${item.id}',${!isOpen})"
            style="background:${isOpen ? '#10b981' : '#cbd5e1'}">
            <div class="adm-toggle-knob" style="left:${isOpen ? '21px' : '3px'}"></div>
          </div>
        </div>
        <div class="adm-branch-actions">
          <button class="adm-btn-edit" onclick="Router.go('admin-queue',{type:'test',search:'${safeName}'})">👥 จัดการคิว</button>
          <button class="adm-btn-edit" onclick="showMasterForm(${JSON.stringify(item).replace(/"/g, '&quot;')})">✏️ แก้ไข</button>
          <button class="adm-btn-del"  onclick="deleteMasterItemClient('${item.id}','${safeName}')">🗑️ ลบ</button>
        </div>
      </div>`;
  }).join('')}
    <div class="adm-add-card" onclick="showMasterForm(null)">
      <div class="adm-add-icon">➕</div>
      <div class="adm-add-label">เพิ่มสาขาทดสอบใหม่</div>
    </div>
  </div>`;
}

function _renderCourseTable(courses) {
  const area = document.getElementById('master-list');
  if (!courses || courses.length === 0) {
    area.innerHTML = `<div class="adm-empty"><div class="adm-empty-icon">📂</div><p>ยังไม่มีข้อมูลหลักสูตรอบรม คลิกปุ่ม "เพิ่มหลักสูตรใหม่" ด้านล่างได้เลย</p></div>`;
    return;
  }

  area.innerHTML = `<div class="adm-branch-grid">${courses.map((item, i) => {
    const cur = item.currentQueue || 0;
    const max = item.maxQueue || 1;
    const pct = Math.round((cur / max) * 100);
    const fillClass = pct >= 100 ? 'red' : pct >= 80 ? 'amber' : 'green';
    const qClass    = pct >= 100 ? 'full' : pct >= 80 ? 'warn' : 'ok';
    const safeName  = (item.name || '').replace(/'/g, "\\'");
    const isOpen    = item.isOpen !== false; // Default true if undefined
    
    let dateStr = '';
    if (item.courseDate) {
      const parts = item.courseDate.split('|');
      const fFn = typeof _formatDate === 'function' ? _formatDate : (d) => d;
      const dt1 = fFn(parts[0]);
      const dt2 = parts[1] ? fFn(parts[1]) : '';
      const dt = dt2 ? `${dt1} - ${dt2}` : dt1;
      dateStr = `<div style="font-size: 13px;color:#475569;margin-top:4px;display:flex;align-items:center;gap:4px;">📅 ${dt}</div>`;
    }
    let mapStr = item.mapUrl ? `<a href="${item.mapUrl}" target="_blank" style="font-size: 12px;color:#9333ea;text-decoration:none;font-weight:600;margin-top:2px;display:inline-block;">📍 ดูแผนที่</a>` : '';

    return `
      <div class="adm-branch-card">
        <div class="adm-branch-num" style="background:linear-gradient(135deg,#a855f7,#7e22ce)">${i + 1}</div>
        <div class="adm-branch-info">
          <div class="adm-branch-name">${item.name}</div>
          <div class="adm-branch-meta">ระยะเวลา: ${item.extra || '-'} วัน <span style="margin-left:8px;color:#94a3b8">|</span> ID: ${item.id}</div>
          ${dateStr}
          <div style="display:flex;gap:10px;align-items:center;margin-top:2px;">
            ${item.docTemplateId
              ? '<div style="font-size: 12px;color:#059669;">✓ มี PDF Template</div>'
              : '<div style="font-size: 12px;color:#f59e0b;">⚠ ยังไม่มี PDF Template</div>'}
            ${mapStr}
          </div>
        </div>
        <div class="adm-branch-quota-col" style="min-width: 90px; text-align: center; margin-right: 12px; flex-shrink:0;">
          <div class="adm-quota-text ${qClass}" style="font-size: 13px; margin-bottom: 4px; font-weight:600;">${cur}/${max} คน</div>
          <div class="adm-progress-mini">
            <div class="adm-progress-mini-fill ${fillClass}" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="adm-toggle">
          <span class="adm-toggle-label">${isOpen ? 'เปิด' : 'ปิด'}</span>
          <div class="adm-toggle-switch" onclick="toggleMasterItem('${item.id}',${!isOpen})"
            style="background:${isOpen ? '#10b981' : '#cbd5e1'}">
            <div class="adm-toggle-knob" style="left:${isOpen ? '21px' : '3px'}"></div>
          </div>
        </div>
        <div class="adm-branch-actions">
          <button class="adm-btn-edit" onclick="Router.go('admin-queue',{type:'training',search:'${safeName}'})">👥 จัดการคิว</button>
          <button class="adm-btn-edit" onclick="showMasterForm(${JSON.stringify(item).replace(/"/g, '&quot;')})">✏️ แก้ไข</button>
          <button class="adm-btn-del"  onclick="handleDeleteCourse('${item.id}','${safeName}')">🗑 ลบ</button>
        </div>
      </div>`;
  }).join('')}
    <div class="adm-add-card" onclick="showMasterForm(null)" style="border-color:#d8b4fe; background-color:#faf5ff;">
      <div class="adm-add-icon" style="color:#9333ea;">➕</div>
      <div class="adm-add-label" style="color:#9333ea;">เพิ่มหลักสูตรอบรมใหม่</div>
    </div>
  </div>`;
}

function switchMasterType(type) {
  _masterType = type;
  ['branch','course'].forEach(t => {
    const btn = document.getElementById('mtab-' + t);
    if (btn) btn.className = 'adm-tab-btn' + (t === type ? ' active' : '');
    
    // Update sidebar active states
    const navBtn = document.getElementById('nav-master-' + t);
    if (navBtn) navBtn.className = 'adm-nav-item' + (t === type ? ' active' : '');
  });
  const addBtn = document.querySelector('.adm-add-btn');
  if (addBtn) addBtn.textContent = `＋ เพิ่ม${type === 'branch' ? 'สาขา' : 'หลักสูตร'}ใหม่`;
  _loadMasterList(type);
}

async function handleDeleteCourse(id, name) {
  Modal.confirm('⚠️ ยืนยันการลบหลักสูตร',
    `ต้องการลบหลักสูตร <b>"${name}"</b> ออกจากระบบใช่หรือไม่?<br><span style="color:#ef4444;font-size: 14px">*ลบแล้วคืนค่าไม่ได้</span>`,
    async () => {
      Toast.info('กำลังลบ...');
      const res = await callAPI('deleteMasterCourse', { token: AppState.sessionToken, courseId: id });
      if (res.success) { Toast.success('ลบหลักสูตรเรียบร้อย'); _loadMasterList('course'); }
      else Toast.error('ลบไม่สำเร็จ: ' + res.error);
    }
  );
}

function showMasterForm(item) {
  const isEdit   = !!item;
  const isBranch = _masterType === 'branch';
  
  let dStart = '', dEnd = '';
  if (isEdit && item.courseDate) {
    if (isBranch) {
      dStart = item.courseDate;
    } else {
      const parts = item.courseDate.split('|');
      dStart = parts[0] || '';
      dEnd   = parts[1] || '';
    }
  }

  Modal.show(`
    <div class="sheet-handle"></div>
    <h3 class="fw-600" style="margin-bottom:16px">${isEdit ? 'แก้ไข' : 'เพิ่ม'}${isBranch ? 'สาขาทดสอบ' : 'หลักสูตรอบรม'}</h3>
    <div class="form-group">
      <label class="form-label">ชื่อ${isBranch ? 'สาขา' : 'หลักสูตร'} <span class="required">*</span></label>
      <input id="mf-name" type="text" class="form-control" placeholder="${isBranch ? 'เช่น ช่างเชื่อม' : 'เช่น ตัดผม'}" value="${isEdit ? item.name : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">${isBranch ? 'ระดับที่เปิด (คั่นด้วย ,)' : 'จำนวนวันอบรม'} <span class="required">*</span></label>
      <input id="mf-extra" type="${isBranch ? 'text' : 'number'}" class="form-control" placeholder="${isBranch ? 'เช่น 1,2,3' : 'เช่น 5'}" value="${isEdit ? item.extra : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">จำนวนรับสูงสุด (คน) <span class="required">*</span></label>
      <input id="mf-max" type="number" class="form-control" min="1" placeholder="เช่น 30" value="${isEdit ? item.maxQueue : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">${isBranch ? 'วันที่จัดทดสอบ' : 'วันที่เริ่ม - สิ้นสุดอบรม'}</label>
      ${isBranch ? `
        <input id="mf-date" type="date" class="form-control" value="${dStart}">
      ` : `
        <div style="display:flex; gap:10px;">
          <input id="mf-date-start" type="date" class="form-control" value="${dStart}" title="วันเริ่มอบรม">
          <input id="mf-date-end" type="date" class="form-control" value="${dEnd}" title="วันสิ้นสุดอบรม">
        </div>
      `}
    </div>
    <div class="form-group">
      <label class="form-label">Google Doc Template ID (สำหรับ PDF)</label>
      <input id="mf-template" type="text" class="form-control" placeholder="วาง File ID จาก Google Drive" value="${isEdit ? (item.docTemplateId || '') : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">ลิงก์ Google Maps สถานที่จัดงาน (ถ้ามี)</label>
      <input id="mf-map" type="url" class="form-control" placeholder="เช่น https://maps.app.goo.gl/..." value="${isEdit ? (item.mapUrl || '') : ''}">
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-secondary" style="flex:1" onclick="Modal.close()">ยกเลิก</button>
      <button class="btn btn-primary" style="flex:1" id="mf-save-btn" onclick="saveMasterItem('${isEdit ? item.id : ''}')">${isEdit ? 'บันทึก' : 'เพิ่ม'}</button>
    </div>
  `);
}

async function saveMasterItem(existingId) {
  const name     = document.getElementById('mf-name')?.value.trim();
  const extra    = document.getElementById('mf-extra')?.value.trim();
  const maxQueue = document.getElementById('mf-max')?.value;
  const tmplId   = document.getElementById('mf-template')?.value.trim();
  const mapUrl   = document.getElementById('mf-map')?.value.trim();
  
  let courseDate = '';
  if (_masterType === 'branch') {
    courseDate = document.getElementById('mf-date')?.value.trim();
  } else {
    const s = document.getElementById('mf-date-start')?.value.trim();
    const e = document.getElementById('mf-date-end')?.value.trim();
    if (s && e) courseDate = s + '|' + e;
    else if (s) courseDate = s;
  }

  if (!name)  { Toast.error('กรุณากรอกชื่อ'); return; }
  if (!extra) { Toast.error('กรุณากรอกข้อมูล'); return; }
  if (!maxQueue || Number(maxQueue) < 1) { Toast.error('จำนวนรับต้องมากกว่า 0'); return; }
  const btn = document.getElementById('mf-save-btn');
  _setLoading(btn, true, 'กำลังบันทึก...');
  const res = await callAPI('saveMasterItem', {
    token: AppState.sessionToken, type: _masterType,
    item: { id: existingId || '', name, extra, maxQueue: Number(maxQueue), docTemplateId: tmplId, courseDate, mapUrl }
  });
  _setLoading(btn, false);
  Modal.close();
  if (!res.success) { Toast.error(res.error); return; }
  Toast.success('บันทึกแล้ว');
  _loadMasterList(_masterType);
}

async function toggleMasterItem(id, isOpen) {
  const res = await callAPI('toggleMasterItem', { token: AppState.sessionToken, type: _masterType, id, isOpen });
  if (!res.success) { Toast.error(res.error); return; }
  Toast.success(isOpen ? 'เปิดรับสมัครแล้ว' : 'ปิดรับสมัครแล้ว');
  _loadMasterList(_masterType);
}

async function deleteMasterItemClient(id, name) {
  if (!confirm(`ลบรายการ "${name}" ใช่หรือไม่?\nไม่สามารถกู้คืนได้`)) return;
  const res = await callAPI('deleteMasterItem', { token: AppState.sessionToken, type: _masterType, id });
  if (!res.success) { Toast.error(res.error); return; }
  Toast.success('ลบรายการสำเร็จ');
  _loadMasterList(_masterType);
}

async function loadReport() {
  const area  = document.getElementById('report-area');
  const month = document.getElementById('rpt-month')?.value;
  const year  = document.getElementById('rpt-year')?.value;
  if (!area) return;
  
  area.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;font-size:14px;"><div style="font-size:32px;margin-bottom:8px">⌛</div>กำลังโหลดข้อมูล...</div>`;
  
  const res = await callAPI('getReport', { token: AppState.sessionToken, month: Number(month), year: Number(year) });
  if (!res.success) { 
    area.innerHTML = `<div style="text-align:center;padding:40px;color:#ef4444;font-size:14px;background:white;border-radius:14px;">${res.error}</div>`; 
    return; 
  }
  
  const d = res.data;
  const breakdown = (byStatus) => Object.entries(byStatus || {}).map(([s,c]) => `
    <div class="adm-rpt-bd-row">
      <span class="adm-status ${s}">${_statusLabel(s)}</span>
      <span class="adm-rpt-bd-count">${c}</span>
    </div>`).join('') || '<div style="padding:16px;text-align:center;color:#94a3b8;font-size:13px">ไม่มีข้อมูล</div>';
    
  area.innerHTML = `
    <div class="adm-rpt-grid">
      <div class="adm-rpt-stat-card">
        <div class="adm-rpt-stat-label">คิวทดสอบมาตรฐานทั้งหมด</div>
        <div class="adm-rpt-stat-val text-indigo-600">${d.test.total}</div>
      </div>
      <div class="adm-rpt-stat-card">
        <div class="adm-rpt-stat-label">คิวอบรมอาชีพทั้งหมด</div>
        <div class="adm-rpt-stat-val text-emerald-600">${d.training.total}</div>
      </div>
    </div>
    
    <div class="adm-rpt-grid">
      <div class="adm-rpt-breakdown">
        <div class="adm-rpt-bd-hdr">📊 คิวทดสอบ — แยกตามสถานะ</div>
        ${breakdown(d.test.byStatus)}
      </div>
      <div class="adm-rpt-breakdown">
        <div class="adm-rpt-bd-hdr">📈 คิวอบรม — แยกตามสถานะ</div>
        ${breakdown(d.training.byStatus)}
      </div>
    </div>
  `;
}
</script>
