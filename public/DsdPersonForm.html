const DsdPersonForm = {
  REQUIRED: [
    'reg_firstname', 'reg_lastname', 'reg_citizenid',
    'reg_birth', 'reg_telephone',
    'reg_address_no', 'reg_address_province',
    'reg_address_district', 'reg_address_subdistrict',
    'reg_education', 'postcode',
  ],

  _root: null,
  _data: null,

  blank() {
    return {
      register_type: '', reg_title: '001', reg_title_en: 'Mr.', reg_firstname: '', reg_lastname: '',
      reg_firstnameEng: '', reg_lastnameEng: '', reg_citizenid: '',
      reg_birth: '', reg_telephone: '', reg_email: '',
      reg_address_no: '', reg_address_moo: '', reg_address_street: '',
      reg_address_soi: '', reg_address_province: '95',
      reg_address_district: '', reg_address_subdistrict: '',
      reg_education: '', reg_education_section: '',
      reg_body_state: '0', reg_body_state_detail: '',
      work_state: '0', work_section: '', work_section_gov: '', work_section_self: '',
      work_salary: '', work_occupation: '', work_position: '',
      work_experience: '', work_place: '', work_province: '',
      work_telephone: '', work_fax: '', work_group: '', work_group_other: '',
      unwork_type: '', unwork_other: '',
      info_type: '04', info_agree: '0', info_findjob: '0',
      info_findjob_detail: '', info_findjob_detail_industry: '',
      sign_img: '', regist_date: '', official: '', gender: '1',
      nationality: '099', postcode: '', info_findjob_country: '',
      industry_desc: '00', profileImage: '',
      info_findjob_detail_industry_desc: '00',
    };
  },

  _mapRegisterType(type) {
    if (type === 'test') return 'T';
    if (type === 'training') return 'F';
    return type || '';
  },

  mount(container, initialData, options) {
    options = options || {};
    this._options = options;
    this._currentStep = 1;
    this._root = container;
    container.innerHTML = this._template();
    container.classList.add('dsd-form');

    this._data = { ...this.blank(), ...initialData };
    const rt = options.registerType || this._data.register_type;
    if (rt) this._data.register_type = this._mapRegisterType(rt);

    this._wire(container);
    this.hydrate(this._data);
    this.updateProgress();
    
    if (this._options.multiStep) {
      this.goToStep(1);
    }
  },

  destroy() {
    if (this._root) this._root.innerHTML = '';
    this._root = null;
    this._data = null;
  },

  _el(field) {
    return this._root?.querySelector('[data-dsd-field="' + field + '"]');
  },

  _q(sel) {
    return this._root?.querySelector(sel);
  },

  setField(key, val) {
    if (!this._data) return;
    this._data[key] = val;
    this.updateProgress();
  },

  selectRadio(field, val, btn) {
    this.setField(field, val);
    const group = btn.closest('[data-dsd-radio]');
    if (group) {
      group.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
  },

  toggleSection(sectionId) {
    const body = this._q('#' + sectionId);
    if (!body) return;
    const hdr = body.previousElementSibling;
    body.classList.toggle('hidden');
    hdr?.classList.toggle('collapsed');
  },

  toggleBodyDetail(show) {
    const row = this._q('#dsd-body-detail-row');
    if (row) row.style.display = show ? 'flex' : 'none';
    this.setField('reg_body_state', show ? '1' : '0');
  },

  toggleWorkFields(show) {
    const wf = this._q('#dsd-work-fields');
    const uf = this._q('#dsd-unwork-fields');
    if (wf) wf.style.display = show ? 'flex' : 'none';
    if (uf) uf.style.display = show ? 'none' : 'flex';
  },

  updateWorkSectionBoxes(val) {
    const govBox = this._q('#dsd-work-section-gov-box');
    const selfBox = this._q('#dsd-work-section-self-box');
    if (govBox) govBox.style.display = val === '3' ? 'flex' : 'none';
    if (selfBox) selfBox.style.display = val === '4' ? 'flex' : 'none';
  },

  updateWorkGroupOther(val) {
    const row = this._q('#dsd-work-group-other-row');
    if (row) row.style.display = val === 'อื่นๆ' ? 'flex' : 'none';
  },

  updateAddressFields(provCode, curDist = '', curSub = '') {
    const distContainer = this._q('#dsd-district-container');
    const subContainer = this._q('#dsd-subdistrict-container');
    if (!distContainer || !subContainer) return;

    const db = SOUTHERN_ADDRESS_DB[provCode];
    if (db) {
      // 1. Render District Select dropdown
      let distHtml = `<select id="dsd_reg_address_district" style="width:100%">`;
      distHtml += `<option value="">-- เลือกอำเภอ --</option>`;
      Object.keys(db).forEach(d => {
        const selected = d === curDist ? 'selected' : '';
        distHtml += `<option value="${d}" ${selected}>${d}</option>`;
      });
      distHtml += `<option value="อื่นๆ" ${curDist === 'อื่นๆ' ? 'selected' : ''}>อื่นๆ (ระบุเอง)</option>`;
      distHtml += `</select>`;
      distContainer.innerHTML = distHtml;

      // 2. Render Subdistrict Select dropdown
      let subHtml = `<select id="dsd_reg_address_subdistrict" style="width:100%">`;
      subHtml += `<option value="">-- เลือกตำบล --</option>`;
      
      const selectedDist = curDist && db[curDist] ? curDist : Object.keys(db)[0];
      if (curDist && db[curDist]) {
        Object.keys(db[curDist]).forEach(s => {
          const selected = s === curSub ? 'selected' : '';
          subHtml += `<option value="${s}" ${selected}>${s}</option>`;
        });
      }
      subHtml += `<option value="อื่นๆ" ${curSub === 'อื่นๆ' ? 'selected' : ''}>อื่นๆ (ระบุเอง)</option>`;
      subHtml += `</select>`;
      subContainer.innerHTML = subHtml;

      const distSelect = distContainer.querySelector('select');
      const subSelect = subContainer.querySelector('select');

      distSelect.addEventListener('change', e => {
        const dVal = e.target.value;
        this._data.reg_address_district = dVal;
        
        if (dVal === 'อื่นๆ') {
          distContainer.innerHTML = `<input type="text" data-dsd-field="reg_address_district" id="dsd_reg_address_district" placeholder="ระบุอำเภอ" value="">`;
          subContainer.innerHTML = `<input type="text" data-dsd-field="reg_address_subdistrict" id="dsd_reg_address_subdistrict" placeholder="ระบุตำบล" value="">`;
          this._data.reg_address_subdistrict = '';
          this._wireTextEvents();
        } else {
          let sHtml = `<option value="">-- เลือกตำบล --</option>`;
          if (db[dVal]) {
            Object.keys(db[dVal]).forEach(s => {
              sHtml += `<option value="${s}">${s}</option>`;
            });
          }
          sHtml += `<option value="อื่นๆ">อื่นๆ (ระบุเอง)</option>`;
          subSelect.innerHTML = sHtml;
          this._data.reg_address_subdistrict = '';
          this.setField('reg_address_district', dVal);
        }
      });

      subSelect.addEventListener('change', e => {
        const sVal = e.target.value;
        this._data.reg_address_subdistrict = sVal;
        
        if (sVal === 'อื่นๆ') {
          subContainer.innerHTML = `<input type="text" data-dsd-field="reg_address_subdistrict" id="dsd_reg_address_subdistrict" placeholder="ระบุตำบล" value="">`;
          this._wireTextEvents();
        } else {
          const dVal = distSelect.value;
          if (db[dVal] && db[dVal][sVal]) {
            const code = db[dVal][sVal];
            const postInput = this._el('postcode');
            if (postInput) {
              postInput.value = code;
              this.setField('postcode', code);
            }
          }
          this.setField('reg_address_subdistrict', sVal);
        }
      });

    } else {
      distContainer.innerHTML = `<input type="text" data-dsd-field="reg_address_district" id="dsd_reg_address_district" placeholder="ระบุอำเภอ" value="${curDist}">`;
      subContainer.innerHTML = `<input type="text" data-dsd-field="reg_address_subdistrict" id="dsd_reg_address_subdistrict" placeholder="ระบุตำบล" value="${curSub}">`;
      this._wireTextEvents();
    }
  },

  _wireTextEvents() {
    const dInput = this._q('#dsd_reg_address_district');
    const sInput = this._q('#dsd_reg_address_subdistrict');
    if (dInput) {
      dInput.addEventListener('input', e => this.setField('reg_address_district', e.target.value));
    }
    if (sInput) {
      sInput.addEventListener('input', e => this.setField('reg_address_subdistrict', e.target.value));
    }
  },

  toggleFindjob(show) {
    const fj = this._q('#dsd-findjob-fields');
    if (fj) fj.style.display = show ? 'flex' : 'none';
    this.setField('info_findjob', show ? '1' : '0');
  },

  loadAvatar(input) {
    const file = input.files[0];
    if (!file) return;
    const self = this;
    const reader = new FileReader();
    reader.onload = e => {
      const imgEl = new Image();
      imgEl.onload = () => {
        const max = 480;
        let w = imgEl.width;
        let h = imgEl.height;
        if (w > max || h > max) {
          const scale = max / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(imgEl, 0, 0, w, h);
        const b64 = canvas.toDataURL('image/jpeg', 0.82);
        self.setField('profileImage', b64);
        const img = self._q('#dsd-avatar-img');
        const ph = self._q('#dsd-avatar-ph');
        if (img) { img.src = b64; img.style.display = 'block'; }
        if (ph) ph.style.display = 'none';
      };
      imgEl.src = e.target.result;
    };
    reader.readAsDataURL(file);
    input.value = '';
  },

  updateProgress() {
    if (!this._root || !this._data) return;
    const filled = this.REQUIRED.filter(f => this._data[f] && String(this._data[f]).trim() !== '').length;
    const pct = Math.round((filled / this.REQUIRED.length) * 100);
    const prog = this._q('#dsd-prog');
    const label = this._q('#dsd-prog-label');
    const badge = this._q('#dsd-field-badge');
    if (prog) prog.style.width = pct + '%';
    if (label) label.textContent = 'กรอกข้อมูลหลัก ' + pct + '%';
    if (badge) {
      const total = Object.values(this._data).filter(v =>
        v && String(v).trim() !== '' && v !== '0' && v !== '00' && v !== '099'
      ).length;
      badge.textContent = total + '/50';
    }
  },

  hydrate(data) {
    if (!this._root) return;
    Object.keys(this.blank()).forEach(k => {
      const el = this._el(k);
      if (!el) return;
      let v = data[k];
      if (el.type === 'date' && v) {
        el.value = String(v).split('T')[0];
      } else if (el.type === 'checkbox') {
        el.checked = v === '1';
      } else if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.value = v != null ? v : '';
      }
    });

    this._root.querySelectorAll('[data-dsd-radio]').forEach(group => {
      const field = group.getAttribute('data-dsd-radio');
      const val = data[field];
      group.querySelectorAll('.radio-btn').forEach(btn => {
        if (btn.closest('[data-dsd-radio]') !== group) return;
        const inp = btn.querySelector('input');
        const match = inp && inp.value === String(val);
        btn.classList.toggle('selected', match);
        if (inp) inp.checked = match;
      });
    });

    this.toggleBodyDetail(data.reg_body_state === '1');
    this.toggleWorkFields(data.work_state === '1');
    this.updateWorkSectionBoxes(data.work_section);
    this.updateWorkGroupOther(data.work_group);
    this.updateAddressFields(data.reg_address_province || '95', data.reg_address_district || '', data.reg_address_subdistrict || '');
    this.toggleFindjob(data.info_findjob === '1');

    if (data.profileImage && String(data.profileImage).startsWith('data:')) {
      const img = this._q('#dsd-avatar-img');
      const ph = this._q('#dsd-avatar-ph');
      if (img) { img.src = data.profileImage; img.style.display = 'block'; }
      if (ph) ph.style.display = 'none';
    }
  },

  collect() {
    if (!this._root || !this._data) return null;
    const out = { ...this._data };

    this._root.querySelectorAll('[data-dsd-field]').forEach(el => {
      const k = el.getAttribute('data-dsd-field');
      if (el.type === 'checkbox') {
        out[k] = el.checked ? '1' : '0';
      } else {
        out[k] = el.value != null ? String(el.value).trim() : '';
      }
    });

    out.regist_date = new Date().toISOString();
    if (out.reg_birth && !out.reg_birth.includes('T')) {
      out.reg_birth = out.reg_birth + 'T00:00:00';
    }
    if (!out.gender) out.gender = '1';
    return out;
  },

  validate() {
    return this.validateStep(null); // null means validate all (for single step mode)
  },

  validateStep(step = null) {
    if (!this._root || !this._data) return false;
    
    // update data
    const queryScope = step ? '#dsd-step-content-' + step + ' [data-dsd-field]' : '[data-dsd-field]';
    this._root.querySelectorAll(queryScope).forEach(el => {
      const k = el.getAttribute('data-dsd-field');
      if (el.type === 'checkbox') {
        this._data[k] = el.checked ? '1' : '0';
      } else {
        this._data[k] = el.value != null ? String(el.value).trim() : '';
      }
    });

    let ok = true;
    let firstErrEl = null;
    
    const errScope = step ? '#dsd-step-content-' + step + ' .err' : '.err';
    this._root.querySelectorAll(errScope).forEach(el => el.classList.remove('err'));

    let fieldsToCheck = this.REQUIRED;
    if (step === 1) fieldsToCheck = ['reg_firstname', 'reg_lastname', 'reg_citizenid', 'reg_birth', 'reg_telephone', 'reg_education'];
    else if (step === 2) fieldsToCheck = ['reg_address_no', 'reg_address_province', 'reg_address_district', 'reg_address_subdistrict', 'postcode'];
    else if (step === 3 || step === 4) fieldsToCheck = []; // special validations below

    fieldsToCheck.forEach(f => {
      const el = this._el(f);
      const empty = !this._data[f] || String(this._data[f]).trim() === '';
      if (el) el.classList.toggle('err', empty);
      if (empty) {
        ok = false;
        if (!firstErrEl && el) firstErrEl = el;
      }
    });

    if (step === null || step === 3) {
      if (this._data.work_state === '1') {
        const workFields = ['work_position', 'work_experience', 'work_place', 'work_province', 'work_telephone'];
        workFields.forEach(f => {
          const el = this._el(f);
          const empty = !this._data[f] || String(this._data[f]).trim() === '';
          if (el) el.classList.toggle('err', empty);
          if (empty) {
            ok = false;
            if (!firstErrEl && el) firstErrEl = el;
          }
        });

        const checkRadio = (field, containerSel) => {
          const empty = !this._data[field] || String(this._data[field]).trim() === '';
          const groupEl = this._q(containerSel);
          if (groupEl) groupEl.classList.toggle('err', empty);
          if (empty) {
            ok = false;
            if (!firstErrEl && groupEl) firstErrEl = groupEl;
          }
        };

        checkRadio('work_section', '[data-dsd-radio="work_section"]');
        checkRadio('work_salary', '[data-dsd-radio="work_salary"]');
        checkRadio('work_group', '[data-dsd-radio="work_group"]');

        if (this._data.work_section === '3') checkRadio('work_section_gov', '[data-dsd-radio="work_section_gov"]');
        if (this._data.work_section === '4') checkRadio('work_section_self', '[data-dsd-radio="work_section_self"]');
        
        if (this._data.work_group === 'อื่นๆ') {
          const el = this._el('work_group_other');
          const empty = !this._data.work_group_other || String(this._data.work_group_other).trim() === '';
          if (el) el.classList.toggle('err', empty);
          if (empty) {
            ok = false;
            if (!firstErrEl && el) firstErrEl = el;
          }
        }
      } else {
        const empty = !this._data.unwork_type || String(this._data.unwork_type).trim() === '';
        const groupEl = this._q('[data-dsd-radio="unwork_type"]');
        if (groupEl) groupEl.classList.toggle('err', empty);
        if (empty) {
          ok = false;
          if (!firstErrEl && groupEl) firstErrEl = groupEl;
        }
      }
    }

    if (step === null || step === 4) {
      if (this._data.info_agree !== '1') {
        const el = this._el('info_agree');
        if (el) {
          const c = el.closest('.p-4');
          if (c) c.classList.add('err');
          ok = false;
          if (!firstErrEl && c) firstErrEl = c;
        }
      }
    }

    if (firstErrEl) {
      firstErrEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (typeof firstErrEl.focus === 'function') firstErrEl.focus({ preventScroll: true });
    }

    return ok;
  },

  nextStep() {
    if (!this.validateStep(this._currentStep)) {
      if (typeof Toast !== 'undefined') {
        if (this._currentStep === 4) Toast.error('กรุณากดยอมรับเงื่อนไข (PDPA)');
        else Toast.error('กรุณากรอกข้อมูลบังคับ (*) ให้ครบถ้วน');
      }
      return false;
    }
    if (this._currentStep < 4) {
      this.goToStep(this._currentStep + 1);
      return true;
    }
    return true; // if at step 4 and valid
  },

  prevStep() {
    if (this._currentStep > 1) {
      this.goToStep(this._currentStep - 1);
    }
  },

  goToStep(step) {
    this._currentStep = step;
    
    for (let i = 1; i <= 4; i++) {
      const content = this._q('#dsd-step-content-' + i);
      if (content) {
        if (i === step) {
          content.classList.remove('hidden');
          // Add a simple fade-in animation by toggling a class
          content.style.animation = 'none';
          content.offsetHeight; // trigger reflow
          content.style.animation = 'fadeIn 0.3s ease forwards';
        } else {
          content.classList.add('hidden');
        }
      }
      
      const nav = this._q('#dsd-step-nav-' + i);
      if (nav) {
        if (i <= step) nav.classList.add('step-primary');
        else nav.classList.remove('step-primary');
      }
    }

    // scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // emit event if callback provided
    if (this._options && typeof this._options.onStepChange === 'function') {
      this._options.onStepChange(step);
    }
  },

  _wire(root) {
    const self = this;

    root.addEventListener('input', e => {
      const el = e.target.closest('[data-dsd-field]');
      if (!el) return;
      let val = el.value;
      if (el.type === 'checkbox') val = el.checked ? '1' : '0';
      self.setField(el.getAttribute('data-dsd-field'), val);
    });

    root.addEventListener('change', e => {
      const el = e.target.closest('[data-dsd-field]');
      if (!el) return;
      const fName = el.getAttribute('data-dsd-field');
      const val = el.value;
      self.setField(fName, val);
      if (fName === 'reg_address_province') {
        self.updateAddressFields(val, '', '');
      }
    });

    root.addEventListener('click', e => {
      const hdr = e.target.closest('.section-hdr');
      if (hdr && root.contains(hdr)) {
        const body = hdr.nextElementSibling;
        if (body && body.classList.contains('section-body')) {
          body.classList.toggle('hidden');
          hdr.classList.toggle('collapsed');
        }
        return;
      }

      const btn = e.target.closest('.radio-btn');
      if (!btn || !root.contains(btn)) return;
      const group = btn.closest('[data-dsd-radio]');
      if (!group) return;
      const field = group.getAttribute('data-dsd-radio');
      const inp = btn.querySelector('input');
      if (!inp) return;
      const val = inp.value;
      self.selectRadio(field, val, btn);

      if (field === 'reg_title') {
        let engVal = 'Mr.';
        if (val === '002') engVal = 'Mrs.';
        else if (val === '003') engVal = 'Miss';
        else if (val === '004') engVal = 'Other';
        
        const engGroup = root.querySelector('[data-dsd-radio="reg_title_en"]');
        if (engGroup) {
          const engBtn = Array.from(engGroup.querySelectorAll('.radio-btn')).find(b => b.querySelector('input')?.value === engVal);
          if (engBtn) {
            self.selectRadio('reg_title_en', engVal, engBtn);
          }
        }
      }

      if (field === 'reg_body_state') self.toggleBodyDetail(val === '1');
      if (field === 'work_state') self.toggleWorkFields(val === '1');
      if (field === 'work_section') self.updateWorkSectionBoxes(val);
      if (field === 'work_group') self.updateWorkGroupOther(val);
      if (field === 'info_findjob') self.toggleFindjob(val === '1');
    });

    const ring = root.querySelector('#dsd-avatar-ring');
    const fileIn = root.querySelector('#dsd-profile-input');
    if (ring && fileIn) {
      ring.addEventListener('click', () => fileIn.click());
    }
    const avBtn = root.querySelector('#dsd-avatar-btn');
    if (avBtn && fileIn) {
      avBtn.addEventListener('click', e => { e.preventDefault(); fileIn.click(); });
    }
    if (fileIn) {
      fileIn.addEventListener('change', function() { self.loadAvatar(this); });
    }
  },

  _template() {
    const isMultiStep = this._options && this._options.multiStep;
    let stepperHtml = '';
    
    if (isMultiStep) {
      stepperHtml = `
      <div class="mb-6 px-0 pt-4">
        <ul class="steps steps-horizontal w-full text-[11px] font-medium font-sans">
          <li id="dsd-step-nav-1" class="step step-primary" data-content="1">ส่วนตัว</li>
          <li id="dsd-step-nav-2" class="step" data-content="2">ติดต่อ</li>
          <li id="dsd-step-nav-3" class="step" data-content="3">อาชีพ</li>
          <li id="dsd-step-nav-4" class="step" data-content="4">ยืนยัน</li>
        </ul>
      </div>`;
    } else {
      stepperHtml = `
      <div class="dsd-prog-row">
        <div class="prog-bar"><div class="prog-fill" id="dsd-prog" style="width:0%"></div></div>
        <div class="prog-label" id="dsd-prog-label">กรอกข้อมูลหลัก 0%</div>
        <span class="badge badge-blue" id="dsd-field-badge">0/50</span>
      </div>`;
    }

    return `
<div class="dsd-wrap ${isMultiStep ? 'pb-24' : ''}">
  ${stepperHtml}

  <div id="dsd-step-content-1" class="dsd-step-content">
    <div class="avatar-zone">
      <div class="avatar-ring" id="dsd-avatar-ring">
        <img id="dsd-avatar-img" src="" alt="">
        <div class="avatar-placeholder" id="dsd-avatar-ph">
          <i class="ti ti-user-circle" aria-hidden="true"></i>
          <span>รูปถ่าย</span>
        </div>
      </div>
      <input type="file" id="dsd-profile-input" accept="image/*" style="display:none">
      <span class="avatar-btn" id="dsd-avatar-btn">เลือกรูป / ถ่ายรูป</span>
    </div>
    ${_dsdSection1()}
  </div>
  
  <div id="dsd-step-content-2" class="dsd-step-content ${isMultiStep ? 'hidden' : ''}">
    ${!isMultiStep ? '<div class="divider"></div>' : ''}
    ${_dsdSection2()}
  </div>
  
  <div id="dsd-step-content-3" class="dsd-step-content ${isMultiStep ? 'hidden' : ''}">
    ${!isMultiStep ? '<div class="divider"></div>' : ''}
    ${_dsdSection3()}
  </div>
  
  <div id="dsd-step-content-4" class="dsd-step-content ${isMultiStep ? 'hidden' : ''}">
    ${!isMultiStep ? '<div class="divider"></div>' : ''}
    ${_dsdSection4()}
    ${_dsdSection5()}
  </div>
</div>`;
  },
};
